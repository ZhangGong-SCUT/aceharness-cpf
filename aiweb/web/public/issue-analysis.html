<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Issue 分析详情 — CPF 工作台</title>
  <link rel="stylesheet" href="css/main.css" />
</head>
<body>
  <header class="ia-page-header">
    <a class="logo" href="/#p-issueanalysis">OHOS <span>CPF-ApplicationTPC</span><span class="logo-badge">AGENT</span></a>
    <div class="font-scale-group" title="字体大小">
      <button class="font-scale-btn fs-sm" data-scale="1" title="标准字体" onclick="setFontScale(1)">A-</button>
      <button class="font-scale-btn fs-md" data-scale="1.15" title="大字体" onclick="setFontScale(1.15)">A</button>
      <button class="font-scale-btn fs-lg" data-scale="1.3" title="超大字体" onclick="setFontScale(1.3)">A+</button>
    </div>
    <div id="auth-header-box"></div>
  </header>
  <main class="ia-detail-main">
    <nav class="ia-detail-nav" aria-label="详情页导航">
      <a class="btn btn-ghost" href="/#p-issueanalysis">← 返回分析历史</a>
      <span class="ia-detail-breadcrumb">Issue 分析 / 分析详情</span>
    </nav>
    <div id="ia-detail-loading" class="ia-detail-loading">正在读取分析任务与历史证据…</div>
    <div id="ia-detail-error" class="error-msg" style="display:none"></div>
    <section class="ia-detail-header" aria-labelledby="ia-detail-title">
      <div class="ia-detail-kicker">ISSUE ANALYSIS</div>
      <div class="ia-detail-title-row">
        <h1 id="ia-detail-title">分析详情</h1>
        <a id="ia-detail-workbench" class="btn btn-ghost" href="#" target="_blank" rel="noopener noreferrer" style="display:none">AceHarness 工作台 ↗</a>
        <button id="ia-detail-copy" class="btn btn-ghost" type="button">复制详情链接</button>
        <button id="ia-detail-stop" class="btn btn-danger" type="button">停止分析</button>
      </div>
      <a id="ia-detail-issue" class="ia-detail-issue-link" href="#" target="_blank" rel="noopener noreferrer"></a>
      <dl class="ia-detail-meta">
        <div><dt>Run ID</dt><dd id="ia-detail-runid">—</dd></div>
        <div><dt>任务 ID</dt><dd id="ia-detail-taskid">—</dd></div>
        <div><dt>创建时间</dt><dd id="ia-detail-created">—</dd></div>
      </dl>
    </section>
    <div id="ia-detail-body" class="ia-detail-body"></div>
  </main>
  <script src="js/utils.js"></script>
  <script src="js/navigation.js"></script>
  <script src="js/prreview.js"></script>
  <script src="js/issueanalysis.js"></script>
  <script src="js/auth.js"></script>
  <script>
    initFontScale();
    window.addEventListener('load', async () => {
      await initAuth();
      await initIssueAnalysisHistory();
    });
  </script>
</body>
</html>
