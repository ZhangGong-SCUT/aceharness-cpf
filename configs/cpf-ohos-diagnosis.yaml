workflow:
  name: 鸿蒙跨平台框架问题AI自动诊断
  description: |
    面向 OHOS 跨平台框架（Flutter-OHOS / React Native-OHOS / KMP-CMP 等）鸿蒙化场景的问题诊断与解决。
    精简版：信息采集(代码仓拉取+分支回退) → 根因分析(含分类定界) → 修复建议(1步) → 修复验证(对抗验证) → 报告沉淀(1步) → 完成。
    优化：删除独立分类定界环节，分类字段（problem_type/layer/priority）由根因分析 Agent 顺带产出，减少一次 LLM 调用和上下文传递断点。
    verdict 枚举：pass / conditional_pass / fail（统一使用，不再使用 skipped，原 skipped 场景统一映射为 conditional_pass）。
    verdict 语义：
    - pass：当前状态目标完全达成，可前进到下一状态。
    - conditional_pass：当前状态已有方向但需打磨，应**优先回退**继续补充/修正/扩展。
      各状态 transitions 已按此语义配置：信息采集/根因分析/报告沉淀的 conditional_pass 仍前进（容忍早期瑕疵）；修复建议/修复验证的 conditional_pass 回退到根因分析（关键决策点要求 pass）。
      Agent 在输出 conditional_pass 时应**显式说明还需要打磨哪些字段**，以便回退时有明确方向。
    - fail：当前状态无法完成，回退或终止。
  mode: state-machine
  maxTransitions: 20
  supervisor:
    enabled: true
    agent: default-supervisor
    stageReviewEnabled: true
    checkpointAdviceEnabled: true
    scoringEnabled: true
    experienceEnabled: true

  states:
    # ========== 状态1：信息采集（代码仓拉取+分支回退）==========
    - name: 信息采集
      description: |
        拉取代码仓到本地，识别 Issue 所在分支，切换到对应分支，并回退到 Issue 提出前的一个 merge commit。
      requireHumanApproval: false
      isInitial: true
      isFinal: false
      position: { x: 100, y: 200 }
      steps:
        - id: collect-issue-info
          name: Issue信息采集
          agent: diagnosis-issue-collector
          role: defender
          task: |
            从 globalContext 中的 Issue 链接获取 Issue 完整内容（标题、body、创建时间、评论、截图、环境信息），识别代码仓库 URL 和分支，执行 clone 到本地，并回退到 Issue 提出前的一个 merge commit。
            1. 从 globalContext 中提取 Issue 链接
            2. 获取 Issue 内容（标题、body、创建时间）：
               - GitCode 链接使用 Gitea API v5 `https://gitcode.com/api/v5/repos/{owner}/{repo}/issues/{number}`
               - GitHub 链接使用 GitHub API
            3. 获取 Issue 评论：
               - GitCode: `https://gitcode.com/api/v5/repos/{owner}/{repo}/issues/{number}/comments`
               - GitHub: `https://api.github.com/repos/{owner}/{repo}/issues/{number}/comments`
               - 从评论中提取：补充复现步骤、环境补充、日志/堆栈、维护者回复、关联 PR/Issue
            4. 下载并解析截图：
               - 从 Issue body 中提取所有图片 URL
               - 下载到 outputs/screenshots/ 目录
               - 描述截图内容（错误界面、黑屏/白屏、花屏/错位、日志截图、代码截图等）
            5. 提取结构化环境信息：
               - 从 Issue body 和评论中提取：设备型号、系统版本、API 版本、框架版本、引擎版本、应用版本、分支信息、复现概率
               - 未提取到的字段标记为 missing
               - 评估环境信息完整性：complete / partial / minimal
            6. 从 Issue 内容中识别代码仓库 URL（Issue 所在仓库本身即为诊断目标仓库）
            7. 识别 Issue 对应的分支：
               - 优先从 Issue 标题/内容推断版本号（如 [3.41] → oh-3.41.9-dev）
               - 无法推断则使用仓库默认分支
            8. 执行 clone（不要用 --depth=1，需要完整历史以回退）：
               - git clone <url> repo/
               - 如果指定分支存在：git -C repo/ checkout <branch>
               - 如果指定分支不存在：使用默认分支
            9. 获取 Issue 创建时间，回退到 Issue 提出前的一个 merge commit：
               - git -C repo/ log --merges --before="<issue_created_at>" --format="%H %ci %s" -1
               - 如果找到 merge commit：git -C repo/ reset --hard <merge_commit_hash>
               - 如果没有找到 merge commit（Issue 时间太早或仓库历史不足）：保持当前 HEAD，记录 warning
            10. 验证当前 HEAD 状态：git -C repo/ log --oneline -1
            11. 列出关键文件路径
            参考 cpf-ohos-issue-analysis Skill 的 references/issue-content-collection.md 获取 Issue 内容采集的详细指导。
            输出结尾必须包含 JSON：verdict、summary、artifact_path、key_findings、repo_path、branch、commit、issue_created_at、reset_target_merge_commit、issue_content_complete、issue_comments_count、screenshots、environment_info、environment_completeness、missing_evidence。
            输出不超过 3000 字。
      transitions:
        # 问题复现环节已注释，信息采集直接指向根因分析（含分类定界）
        # 如需恢复问题复现，取消下方注释并将根因分析的 transitions 改回问题复现
        - to: 根因分析
          condition: { verdict: pass }
          priority: 1
          label: 代码仓拉取完成，进入根因分析
        - to: 根因分析
          condition: { verdict: conditional_pass }
          priority: 2
          label: 代码仓拉取有瑕疵（如无法回退），但仍可继续根因分析
        - to: 终止
          condition: { verdict: fail }
          priority: 3
          label: 代码仓拉取失败，终止诊断

    # ========== 状态2（已注释）：问题复现（构造Demo复现Issue问题）==========
    # 如需恢复问题复现环节，取消下方注释，并将信息采集的 transitions 改回指向问题复现
    # - name: 问题复现
    #   description: |
    #     根据信息采集中收集到的信息，构造 Demo 来复现 Issue 中描述的问题。
    #     如果 Issue 中直接提供了 Demo，验证并补全为完整可运行。
    #   requireHumanApproval: false
    #   isInitial: false
    #   isFinal: false
    #   position: { x: 225, y: 200 }
    #   steps:
    #     - id: reproduce-issue
    #       name: 问题复现
    #       agent: diagnosis-reproducer
    #       role: defender
    #       task: |
    #         根据信息采集阶段的输出（Issue 内容、复现步骤、环境信息、截图描述、代码仓路径），构造 Demo 来复现 Issue 中描述的问题。
    #         1. 从上游信息采集结果中获取：Issue 正文、复现步骤、环境信息、截图描述、代码仓本地路径（repo/）
    #         2. 判断 Issue 中是否直接提供了 Demo 代码：
    #            - 检查 Issue body 和评论中是否有代码块（```dart、```typescript、```arkts 等）
    #            - 检查是否有完整的可运行示例
    #         3. 根据情况选择 Demo 构造策略：
    #            - 【策略 A】Issue 提供了完整 Demo：直接使用，补充运行说明
    #            - 【策略 B】Issue 提供了部分代码片段：基于片段 + 代码仓相关代码补全
    #            - 【策略 C】Issue 只有文字描述：根据描述 + 代码仓相关代码从零构造
    #            - 【策略 D】无法构造 Demo：说明原因，输出理论复现路径
    #         4. 如果需要参考代码仓中的代码：
    #            - 在 repo/ 目录中搜索与 Issue 相关的代码文件
    #            - 使用 grep/glob 找到相关代码
    #            - 基于找到的代码构造最小复现 Demo
    #         5. 输出完整可运行的 Demo 代码（含使用说明）
    #         6. 记录复现稳定性（stable/intermittent/unstable/not_reproducible/theoretical）
    #         7. 输出复现基线（stable_steps + expected_behavior + actual_behavior + verification_method）
    #         输出结尾必须包含 JSON：verdict、summary、artifact_path、key_findings、reproduction_status、demo_source、demo_code、demo_usage、expected_behavior、actual_behavior、verification_method、missing_evidence。
    #         输出不超过 5000 字。
    #   transitions:
    #     - to: 分类定界
    #       condition: { verdict: pass }
    #       priority: 1
    #       label: 问题复现完成，进入分类定界
    #     - to: 分类定界
    #       condition: { verdict: conditional_pass }
    #       priority: 2
    #       label: 问题复现有瑕疵（如无法实际运行），但仍可继续分类
    #     - to: 分类定界
    #       condition: { verdict: fail }
    #       priority: 3
    #       label: 问题无法复现，但仍进入分类定界（基于 Issue 描述分析）

    # ========== 状态2：根因分析（含分类定界，1步，含兜底逻辑）==========
    - name: 根因分析
      description: |
        综合素材包，定位根本原因。
        单步完成——如果置信度<0.3，Agent自行输出排查思路（兜底逻辑内联）。
      requireHumanApproval: false
      isInitial: false
      isFinal: false
      position: { x: 350, y: 200 }
      steps:
        - id: analyze-root-cause
          name: 根因定位
          agent: diagnosis-root-cause-analyzer
          role: defender
          task: |
            综合素材包，定位根本原因（含分类定界）：
            1. 基于信息采集阶段的 Issue 摘要和环境信息，确定问题分类：
               - problem_type（稳定性/内存泄漏/功能/性能/渲染）
               - layer（应用层/插件层/框架层/引擎层/系统层）
               - priority（P0-P3）
            2. 执行日志分析、代码审查、差异对比
            3. 匹配已知根因模式
            4. 输出根因假设 + 证据链 + 置信度
            5. 如果置信度<0.3，直接在输出中包含兜底排查思路（可疑方向、验证步骤、缺失信息清单）
            6. 必须区分 confirmed（已由 Issue/API/日志/代码直接证明）、inferred（基于代码和平台差异推断）、unverified（待运行时验证）；不得把未验证的症状解释写成事实。
            7. 【硬约束】不要搜索 Issue 所在仓库的其他 PR 和 Issue（如列出仓库所有 PR、搜索相关 PR/Issue 等）。但允许获取当前 Issue 本身的信息（标题、body、评论、创建时间等），可通过 GitCode/GitHub API 的 issues/{number} 端点获取。所有代码分析只在本地代码仓（repo/ 目录）中进行。
            8. 如果根因分析需要参考上游信息，必须以 upstream_status="unknown" + upstream_search_keywords（供用户手动搜索的关键词）形式输出，不得给出确定的 PR/Issue 链接，不得自行推断上游仓库地址。
            参考 cpf-ohos-issue-analysis Skill 的 issue-types/*.md 和 references/log-interpretation.md。
            输出 JSON 或 Markdown+JSON 均可，但结尾必须包含 verdict、summary、artifact_path、key_findings、problem_type、layer、priority、confidence、confirmed_evidence、inferred_evidence、missing_evidence、upstream_status（只能为 "unknown"）、upstream_search_keywords。
            输出不超过 2000 字。
      transitions:
        - to: 修复建议
          condition: { verdict: pass }
          priority: 1
          label: 根因确定，进入修复建议
        - to: 修复建议
          condition: { verdict: conditional_pass }
          priority: 2
          label: 根因有不确定项，但仍可给出修复建议
        - to: 报告沉淀
          condition: { verdict: fail }
          priority: 3
          label: 根因无法确定，直接生成报告（含兜底排查思路）

    # ========== 状态3：修复建议（1步，无裁决，无自循环）==========
    - name: 修复建议
      description: |
        基于确认的根因，提出修复方案。单步完成，无需裁决，无自循环——
        修复方案质量在修复验证阶段进行对抗检验。
      requireHumanApproval: false
      isInitial: false
      isFinal: false
      position: { x: 850, y: 200 }
      steps:
        - id: design-fix
          name: 修复方案设计
          agent: diagnosis-fix-advisor
          role: defender
          task: |
            基于确认的根因，设计系统性修复方案：
            1. 根据根因层面选择修复策略
            2. 不追踪 Issue 所在仓库的上游仓库信息（如 Issue 在 openharmony-tpc/flutter_flutter，不要去查 flutter/flutter 主仓库的 PR/Issue）
            3. 生成短期修复 + 根因修复 + 长期改进的完整建议
            4. 评估修复风险和影响范围
            5. 明确哪些修复依据已验证、哪些依赖运行时补充验证；未编译/未运行时不得声称修复已验证。
            6. 【OHOS 独有问题修复优先级】如果根因是 OHOS 端独有问题（Android/iOS 不存在），优先通过修改 Native 端（C++/ArkTS）代码解决，而非 Dart 层补丁。在 JSON 中标注 fix_code_layer（native/framework/dart）和 is_ohos_specific（true/false）。如果选择 Dart 层修复，必须在 risk_assessment 中说明为何无法在 Native 层修复。
            输出结尾必须包含 verdict、summary、artifact_path、key_findings、fix_strategy、risk_level、verification_status、missing_evidence、upstream_status（只能为 unknown）。
            输出不超过 2000 字。
      transitions:
        - to: 修复验证
          condition: { verdict: pass }
          priority: 1
          label: 修复方案完成，进入修复验证
        - to: 根因分析
          condition: { verdict: conditional_pass }
          priority: 2
          label: 修复方案有条件通过，回到根因分析重新打磨根因/方案
        - to: 报告沉淀
          condition: { verdict: fail }
          priority: 3
          label: 修复方案驳回，输出建议供人工执行

    # ========== 状态4：修复验证（对抗验证，conditional_pass 也回退根因分析）==========
    - name: 修复验证
      description: |
        以攻击者视角验证修复方案的有效性。验证修复是否真正解决根因、是否覆盖所有触发路径、是否引入回归风险。
        验证结论要求：只有 verdict=pass 才进入报告沉淀；verdict=conditional_pass 或 fail 均回到根因分析重新定位根因和修复方案。
        为防止无限循环，maxTransitions 已限制总流转次数；根因分析→修复建议→修复验证 最多循环 2 次。
      requireHumanApproval: false
      isInitial: false
      isFinal: false
      position: { x: 975, y: 200 }
      steps:
        - id: verify-fix
          name: 修复方案对抗验证
          agent: diagnosis-fix-verifier-advisor
          role: defender
          task: |
            以攻击者视角验证修复方案的有效性（效率约束：最多读取 5 个文件，输出不超过 1500 字）：
            1. 验证修复方案能否解决 Issue 中反馈的问题：修复后 Issue 描述的现象是否消失？Issue 中的复现步骤是否还能触发问题
            2. 验证修复方案与根因的对应性：修复是否针对确认的根因，而非表面症状
            3. 构造绕过场景：基于 Issue 的复现步骤和触发条件，构造修复未覆盖的场景
            4. 副作用分析：修复是否会破坏现有功能？是否引入新的风险
            5. 三端一致性检查：修复后的行为是否与 Android/iOS 基线一致
            6. 回归风险评估：修复的影响范围是否可控
            效率要求：根因分析和修复建议阶段已提供代码定位，优先引用已有结论；如需读取代码文件，最多读取 5 个文件，每个最多读取一次。
            如果验证未达 pass（verdict=conditional_pass 或 fail），必须在 feedback_to_root_cause 字段中说明回到根因分析时需要补充的方向。
            输出结尾必须包含 <step-conclusion> 标签，内含 verdict、summary、issue_resolved、root_cause_coverage、regression_risk、feedback_to_root_cause、missing_scenarios。
            输出不超过 1500 字。
      transitions:
        - to: 报告沉淀
          condition: { verdict: pass }
          priority: 1
          label: 修复验证通过，进入报告沉淀
        - to: 根因分析
          condition: { verdict: conditional_pass }
          priority: 2
          label: 修复验证有条件通过（仍需打磨），回到根因分析重新打磨
        - to: 根因分析
          condition: { verdict: fail }
          priority: 3
          label: 修复验证未通过，回到根因分析重新定位

    # ========== 状态5：报告沉淀（1步，无裁决）==========
    - name: 报告沉淀
      description: |
        生成结构化诊断报告。单步完成，无需裁决——报告质量在内容本身，不需要额外裁决步骤。
      requireHumanApproval: false
      isInitial: false
      isFinal: false
      position: { x: 1100, y: 200 }
      steps:
        - id: generate-report
          name: 生成诊断报告
          agent: diagnosis-reporter
          role: defender
          task: |
            收集全流程上下文，生成结构化诊断报告。

            【⚠️ 输出方式约束】你的最终输出内容（不是调用 write 工具，而是直接输出的文本）将被工作流引擎自动保存为 outputs/报告沉淀-生成诊断报告.md。因此你必须直接输出完整的诊断报告内容，不要只输出摘要或路径。

            【⚠️ finalMessage 范围硬约束 - 违规将污染归档文件】
            1. 禁止调用任何工具（Read/Glob/Grep/Write/Edit/Bash 等）。模板已内联
               在 systemPrompt，前序结论由工作流引擎自动注入到本步骤上下文——
               你不需要检索任何东西。
            2. 禁止在 finalMessage 中复述前序步骤的结论文本。直接根据上下文生成
               报告，不要把"## 结果 / 裁决 / ## 下一步所需上下文"等元数据块、
               上一阶段的 JSON 块、Issue 内容块粘贴到输出里。
            3. finalMessage 只输出：(a) # 诊断报告 标题 + 6 个模板章节 + 末尾
               JSON，(b) <step-conclusion> 标签内的 verdict JSON。
               不得在报告正文前 / 报告正文后 / JSON 之后输出任何额外内容（不要
               输出"以下是诊断报告："、"已生成报告，路径为..."、"如需修改请
               告知"等元话语）。

            报告内容要求：
            1. 严格按标准模板生成报告，只输出模板中定义的章节（问题概述、环境信息、复现步骤、根因结论、修复建议、验证建议），不得增减章节
            2. 报告面向定位问题的开发者，语言简洁直接，避免元数据和工作流内部术语
            3. 报告中必须显式区分：已确认事实直接陈述；基于代码推断的写"推测"；未运行时验证的写"待验证"
            4. 如果 Issue 正文/评论/截图/日志缺失，在对应位置标注"未提供"，不得编造；报告不得给出"已验证解决"结论
            5. 报告末尾追加可解析 JSON：
               `{"verdict":"pass|conditional_pass|fail","summary":"...","key_findings":[...],"verification_status":"verified|skipped|needs_runtime_validation","missing_evidence":[...]}`
            参考 cpf-ohos-issue-analysis Skill 的 references/report-template.md 报告模板。
            输出不超过 2000 字。
      transitions:
        - to: 完成
          condition: { verdict: pass }
          priority: 1
          label: 诊断报告完成
        - to: 完成
          condition: { verdict: conditional_pass }
          priority: 2
          label: 报告有瑕疵但仍可用
        - to: 完成
          condition: { verdict: fail }
          priority: 3
          label: 报告生成失败，输出已有内容

    # ========== 终止状态：完成 ==========
    - name: 完成
      description: 诊断流程完成
      isInitial: false
      isFinal: true
      position: { x: 1350, y: 200 }
      steps:
        - id: diagnosis-complete
          name: 诊断完成
          agent: diagnosis-completer
          role: defender
          task: |
            诊断流程完成，输出最终总结：
            1. 诊断报告路径（完整报告可通过 GET /api/runs/{runId}/step-logs?step=报告沉淀-生成诊断报告 获取）
            2. 根因结论摘要
            3. 修复建议摘要
            4. 后续行动建议
            5. 明确修复验证状态；如果前序报告标记为 skipped 或 needs_runtime_validation，不得表述为已解决。
            6. 【磁盘清理】输出最终总结后，执行以下清理命令删除本次 run clone 的仓库目录以回收磁盘空间（诊断报告和状态已持久化到 ~/.aceharness/runs/，不受影响）：
               rm -rf repo/
               清理失败不影响诊断结论，在输出中标注清理结果即可。
            输出不超过 1000 字。
      transitions: []

    # ========== 终止状态：终止 ==========
    - name: 终止
      description: 诊断流程异常终止
      isInitial: false
      isFinal: true
      position: { x: 100, y: 450 }
      steps:
        - id: diagnosis-abort
          name: 终止记录
          agent: diagnosis-completer
          role: defender
          task: |
            记录诊断终止原因和已有分析记录。
            然后执行磁盘清理，删除本次 run clone 的仓库目录：
            rm -rf repo/
            清理失败不影响终止记录，在输出中标注清理结果即可。
            输出不超过 1000 字。
      transitions: []

context:
  # 诊断目标的工程目录：被诊断 Issue 所在的真实代码仓由 agent 在 cwd 内
  # `git clone ... repo/` 拉取。这里 projectRoot 仅作为 isolated-copy 的
  # 复制源（_template/），实际 agent 工作目录 = `<personalDir>/<runId>/`。
  # personalDir 来自 `~/.aceharness/data/users.json` 当前用户，由 engine
  # 启动时动态注入到 `_userPersonalDir`，本字段使用相对路径
  # `path.resolve(_userPersonalDir, projectRoot)` 即可正确拼到用户目录。
  # 不要在仓库内硬编码任何用户级绝对路径。
  projectRoot: "_template"
  workspaceMode: isolated-copy
  requirements: |
    OHOS 跨平台框架（Flutter-OHOS / React Native-OHOS / KMP-CMP 等）鸿蒙化问题诊断与解决。
    输入：一个 GitCode/GitHub Issue 链接（通过 globalContext 传入）。
    工作流自动从 Issue 链接获取问题描述、复现步骤、环境信息等全部内容。
    输出：结构化诊断报告 + 修复建议。
    支持问题类型：稳定性、内存泄漏、功能、性能、渲染。
    支持问题层面：应用层、插件层、框架层、引擎层、系统层。
    核心特色：代码仓回退定位、兜底诊断、结构化修复建议。
  timeoutMinutes: 60
  gitBaselineEnabled: false
  executionPolicy:
    defaultEngine: opencode
    defaultModel: volcano-gateway/MiniMax-M3
  skills:
    - cpf-ohos-issue-analysis
