workflow:
  name: 鸿蒙跨平台框架问题AI自动诊断
  description: |
    面向 OHOS 跨平台框架（Flutter-OHOS / React Native-OHOS / KMP-CMP 等）鸿蒙化场景的问题诊断与解决。
    精简版：信息采集(代码仓拉取+分支回退) → 根因分析(红蓝对抗+含分类定界) → 修复建议 → 修复验证(对抗验证) → 报告沉淀 → 完成。
    verdict 枚举：pass / conditional_pass / fail（不再使用 skipped，原 skipped 场景统一映射为 conditional_pass）。
    - pass：当前状态目标完全达成，可前进到下一状态。
    - conditional_pass：已有方向但需打磨，应优先回退继续补充（信息采集/根因分析/报告沉淀的 cpass 仍前进；修复建议/修复验证的 cpass 回退根因分析）。
    - fail：当前状态无法完成，回退或终止。
  mode: state-machine
  maxTransitions: 30
  supervisor:
    enabled: true
    agent: default-supervisor
    stageReviewEnabled: true
    checkpointAdviceEnabled: true
    scoringEnabled: true
    experienceEnabled: true

  states:
    # ========== 状态1：信息采集（代码仓拉取+分支回退）==========
    - name: 信息采集
      description: |
        拉取代码仓到本地，识别 Issue 所在分支，切换到对应分支，并回退到 Issue 提出前的一个 merge commit。
      requireHumanApproval: false
      isInitial: true
      isFinal: false
      position: { x: 100, y: 200 }
      steps:
        - id: collect-issue-info
          name: Issue信息采集
          agent: diagnosis-issue-collector
          role: defender
          task: |
            从 globalContext 中的 Issue 链接获取 Issue 完整内容，识别代码仓库 URL 和分支，clone 到本地并回退到 Issue 提出前的 merge commit。
            1. 提取 Issue 链接，获取 Issue 内容（标题、body、创建时间、评论、截图）
            2. 下载截图到 outputs/screenshots/，描述截图内容
            3. 提取结构化环境信息（设备/系统/API/框架/引擎版本、分支、复现概率），评估完整性
            4. 识别代码仓库 URL 和分支（从 Issue 标题/内容推断版本号，无法推断则用默认分支）
            5. clone 仓库（不要 --depth=1，需完整历史），checkout 到对应分支
            6. 回退到 Issue 创建时间前的一个 merge commit（git log --merges --before=<issue_created_at>），找不到则保持 HEAD 并记录 warning
            7. 验证当前 HEAD，列出关键文件路径
            API URL、截图解析、环境信息字段等详细指导见 cpf-ohos-issue-analysis Skill 的 references/issue-content-collection.md。
            输出结尾必须包含 JSON：verdict、summary、artifact_path、key_findings、repo_path、branch、commit、issue_created_at、reset_target_merge_commit、issue_content_complete、issue_comments_count、screenshots、environment_info、environment_completeness、missing_evidence。
      transitions:
        # 信息采集直接指向根因分析（问题复现环节已移除，如需恢复见 git 历史）
        - to: 根因分析
          condition: { verdict: pass }
          priority: 1
          label: 代码仓拉取完成，进入根因分析
        - to: 根因分析
          condition: { verdict: conditional_pass }
          priority: 2
          label: 代码仓拉取有瑕疵（如无法回退），但仍可继续根因分析
        - to: 终止
          condition: { verdict: fail }
          priority: 3
          label: 代码仓拉取失败，终止诊断

    # ========== 状态2：根因分析（红蓝对抗 + 多轮迭代收敛，含兜底逻辑）==========
    - name: 根因分析
      description: |
        综合素材包，定位根本原因。采用红蓝对抗 3 步结构：
        defender 定位根因 → attacker 质疑挑战 → judge 裁决是否可进入修复建议。
        支持多轮迭代收敛——judge 输出 conditional_pass 时回退到 defender 继续打磨，
        每轮聚焦补充 missing_evidence 中列出的缺口，逐步收敛到精确根因。
        如果置信度<0.3 且无法继续迭代，judge 输出 fail 进入兜底报告。
      requireHumanApproval: false
      isInitial: false
      isFinal: false
      position: { x: 350, y: 200 }
      steps:
        - id: analyze-root-cause
          name: 根因定位
          agent: diagnosis-root-cause-analyzer
          role: defender
          task: |
            综合素材包，定位根本原因（含分类定界）。支持多轮迭代收敛：
            1. 基于信息采集阶段的 Issue 摘要和环境信息，确定问题分类：
               - problem_type（稳定性/内存泄漏/功能/性能/渲染）
               - layer（应用层/插件层/框架层/引擎层/系统层）
               - priority（P0-P3）
            2. 执行日志分析、代码审查、差异对比
            3. 匹配已知根因模式
            4. 输出根因假设 + 证据链 + 置信度
            5. 【多轮迭代收敛机制】如果置信度<0.8 或 evidence_chain 不足 2 条 confirmed 证据：
               - verdict=conditional_pass（回退到自身继续打磨）
               - 在 missing_evidence 中**显式列出本轮缺失的证据/待验证方向**
               - 在 next_iteration_focus 中说明下一轮应聚焦补充什么（如"需读取 xxx.cpp 第 N 行附近代码"、"需对比 Android 端 xxx 实现"）
               - 下一轮迭代时优先针对 missing_evidence 补充，不要从头重做
            6. 如果置信度<0.3 且已迭代 3 轮仍无法收敛，直接在输出中包含兜底排查思路（可疑方向、验证步骤、缺失信息清单），verdict=fail
            7. 必须区分 confirmed（已由 Issue/API/日志/代码直接证明）、inferred（基于代码和平台差异推断）、unverified（待运行时验证）；不得把未验证的症状解释写成事实。
            8. 【硬约束】不要搜索 Issue 所在仓库的其他 PR 和 Issue（如列出仓库所有 PR、搜索相关 PR/Issue 等）。但允许获取当前 Issue 本身的信息（标题、body、评论、创建时间等），可通过 GitCode/GitHub API 的 issues/{number} 端点获取。所有代码分析只在本地代码仓（repo/ 目录）中进行。
            9. 如果根因分析需要参考上游信息，必须以 upstream_status="unknown" + upstream_search_keywords（供用户手动搜索的关键词）形式输出，不得给出确定的 PR/Issue 链接，不得自行推断上游仓库地址。
            参考 cpf-ohos-issue-analysis Skill 的 issue-types/*.md 和 references/log-interpretation.md。
            输出 JSON 或 Markdown+JSON 均可，但结尾必须包含 verdict、summary、artifact_path、key_findings、problem_type、layer、priority、confidence、confirmed_evidence、inferred_evidence、missing_evidence、next_iteration_focus（conditional_pass 时必填）、upstream_status（只能为 "unknown"）、upstream_search_keywords。

        - id: challenge-root-cause
          name: 根因质疑
          agent: diagnosis-challenger
          role: attacker
          task: |
            以批判性视角质疑 defender（diagnosis-root-cause-analyzer）的根因分析结论，发现遗漏、错误和风险。
            1. 质疑分类结果：problem_type / layer / priority 是否准确
            2. 质疑根因假设：证据链是否充分？是否遗漏其他可能原因？是否存在替代根因路径？
            3. 质疑证据可靠性：confirmed/inferred/unverified 区分是否正确？是否有未验证的症状被写成事实？
            4. 质疑置信度：confidence 评估是否客观？是否过于乐观？
            5. 检查边界条件：是否考虑了异常场景、并发场景、平台差异？
            6. 检查 Android/iOS 基线对比：defender 是否真的对比了三端实现？对比是否充分？
            效率约束：只读取项目源码文件，不读取 ACEHarness 内部状态文件。
            输出结尾必须包含 <step-conclusion> 标签，内含 verdict（pass/conditional_pass/fail）、challenges（质疑点列表）、alternative_hypotheses（替代根因假设，如有）、evidence_gaps（证据缺口）。
        - id: judge-root-cause
          name: 根因裁决
          agent: diagnosis-judge
          role: judge
          task: |
            在 defender（根因定位）和 attacker（根因质疑）之间做出客观裁决，判断根因结论是否可接受、能否进入修复建议阶段。
            1. 审查 defender 的根因结论和 attacker 的质疑发现
            2. 判断根因结论是否基于充分证据、质疑是否合理
            3. 评估置信度是否客观、分类定界是否准确
            4. 做出明确裁决：
               - pass：根因确定（confidence≥0.8 且 confirmed 证据≥2 条 且 attacker 无重大质疑），进入修复建议
               - conditional_pass：方向正确但需补充修正，回退到 defender 继续迭代（针对 attacker 的 evidence_gaps 补充）
               - fail：根因无法确定（迭代 3 轮仍 confidence<0.3 或 attacker 发现重大错误），进入兜底报告
            5. 如果 conditional_pass，在 feedback_to_defender 中说明回退时需要补充的方向
            效率约束：只读取项目源码文件，不读取 ACEHarness 内部状态文件。
            输出结尾必须包含 <step-conclusion> 标签，内含 verdict、summary、confidence_assessment、feedback_to_defender（conditional_pass 时必填）、ruling_reason。
      transitions:
        - to: 修复建议
          condition: { verdict: pass }
          priority: 1
          label: 根因确定（judge 裁决通过），进入修复建议
        - to: 根因分析
          condition: { verdict: conditional_pass }
          priority: 2
          label: judge 裁决需打磨，回退到 defender 继续迭代收敛（针对 evidence_gaps 补充）
        - to: 报告沉淀
          condition: { verdict: fail }
          priority: 3
          label: 根因无法确定（迭代 3 轮仍置信度<0.3 或 attacker 发现重大错误），直接生成报告（含兜底排查思路）

    # ========== 状态3：修复建议（1步，无裁决，无自循环）==========
    - name: 修复建议
      description: |
        基于确认的根因，提出修复方案。单步完成，无需裁决，无自循环——
        修复方案质量在修复验证阶段进行对抗检验。
      requireHumanApproval: false
      isInitial: false
      isFinal: false
      position: { x: 850, y: 200 }
      steps:
        - id: design-fix
          name: 修复方案设计
          agent: diagnosis-fix-advisor
          role: defender
          task: |
            基于确认的根因，设计系统性修复方案：
            1. 根据根因层面选择修复策略
            2. 不追踪 Issue 所在仓库的上游仓库信息（如 Issue 在 openharmony-tpc/flutter_flutter，不要去查 flutter/flutter 主仓库的 PR/Issue）
            3. 生成短期修复 + 根因修复 + 长期改进的完整建议
            4. 评估修复风险和影响范围
            5. 明确哪些修复依据已验证、哪些依赖运行时补充验证；未编译/未运行时不得声称修复已验证。
            6. 【OHOS 独有问题修复优先级】如果根因是 OHOS 端独有问题（Android/iOS 不存在），优先通过修改 Native 端（C++/ArkTS）代码解决，而非 Dart 层补丁。在 JSON 中标注 fix_code_layer（native/framework/dart）和 is_ohos_specific（true/false）。如果选择 Dart 层修复，必须在 risk_assessment 中说明为何无法在 Native 层修复。
            输出结尾必须包含 verdict、summary、artifact_path、key_findings、fix_strategy、risk_level、verification_status、missing_evidence、upstream_status（只能为 unknown）。
      transitions:
        - to: 修复验证
          condition: { verdict: pass }
          priority: 1
          label: 修复方案完成，进入修复验证
        - to: 根因分析
          condition: { verdict: conditional_pass }
          priority: 2
          label: 修复方案有条件通过，回到根因分析重新打磨根因/方案
        - to: 报告沉淀
          condition: { verdict: fail }
          priority: 3
          label: 修复方案驳回，输出建议供人工执行

    # ========== 状态4：修复验证（对抗验证，conditional_pass 也回退根因分析）==========
    - name: 修复验证
      description: |
        以攻击者视角验证修复方案的有效性。验证修复是否真正解决根因、是否覆盖所有触发路径、是否引入回归风险。
        验证结论要求：只有 verdict=pass 才进入报告沉淀；verdict=conditional_pass 或 fail 均回到根因分析重新定位根因和修复方案。
        为防止无限循环，maxTransitions=30 限制总流转次数；根因分析（含红蓝对抗 3 步）→修复建议→修复验证 整体最多循环 3 次。
      requireHumanApproval: false
      isInitial: false
      isFinal: false
      position: { x: 975, y: 200 }
      steps:
        - id: verify-fix
          name: 修复方案对抗验证
          agent: diagnosis-fix-verifier-advisor
          role: defender
          task: |
            以攻击者视角验证修复方案的有效性（效率约束：最多读取 5 个文件）：
            1. 验证修复方案能否解决 Issue 中反馈的问题：修复后 Issue 描述的现象是否消失？Issue 中的复现步骤是否还能触发问题
            2. 验证修复方案与根因的对应性：修复是否针对确认的根因，而非表面症状
            3. 构造绕过场景：基于 Issue 的复现步骤和触发条件，构造修复未覆盖的场景
            4. 副作用分析：修复是否会破坏现有功能？是否引入新的风险
            5. 三端一致性检查：修复后的行为是否与 Android/iOS 基线一致
            6. 回归风险评估：修复的影响范围是否可控
            效率要求：根因分析和修复建议阶段已提供代码定位，优先引用已有结论；如需读取代码文件，最多读取 5 个文件，每个最多读取一次。
            如果验证未达 pass（verdict=conditional_pass 或 fail），必须在 feedback_to_root_cause 字段中说明回到根因分析时需要补充的方向。
            输出结尾必须包含 <step-conclusion> 标签，内含 verdict、summary、issue_resolved、root_cause_coverage、regression_risk、feedback_to_root_cause、missing_scenarios。
      transitions:
        - to: 报告沉淀
          condition: { verdict: pass }
          priority: 1
          label: 修复验证通过，进入报告沉淀
        - to: 根因分析
          condition: { verdict: conditional_pass }
          priority: 2
          label: 修复验证有条件通过（仍需打磨），回到根因分析重新打磨
        - to: 根因分析
          condition: { verdict: fail }
          priority: 3
          label: 修复验证未通过，回到根因分析重新定位

    # ========== 状态5：报告沉淀（1步，无裁决）==========
    - name: 报告沉淀
      description: |
        生成结构化诊断报告。单步完成，无需裁决——报告质量在内容本身，不需要额外裁决步骤。
      requireHumanApproval: false
      isInitial: false
      isFinal: false
      position: { x: 1100, y: 200 }
      steps:
        - id: generate-report
          name: 生成诊断报告
          agent: diagnosis-reporter
          role: defender
          task: |
            收集全流程上下文，生成结构化诊断报告。直接输出完整报告内容（工作流引擎会自动保存到 outputs/报告沉淀-生成诊断报告.md）。
            报告章节（严格按此输出，不得增减）：问题概述、环境信息、复现步骤、根因结论、修复建议、验证建议。
            1. 报告面向定位问题的开发者，语言简洁直接，避免元数据和工作流内部术语
            2. 显式区分：已确认事实直接陈述；基于代码推断的写"推测"；未运行时验证的写"待验证"
            3. Issue 正文/评论/截图/日志缺失时标注"未提供"，不得编造；不得给出"已验证解决"结论
            4. 报告末尾追加 JSON：`{"verdict":"pass|conditional_pass|fail","summary":"...","key_findings":[...],"verification_status":"verified|skipped|needs_runtime_validation","missing_evidence":[...]}`
            报告模板和输出约束（禁止调用工具、禁止复述前序结论等）见 cpf-ohos-issue-analysis Skill 的 references/report-template.md 和 diagnosis-reporter Agent 的 systemPrompt。
      transitions:
        - to: 完成
          condition: { verdict: pass }
          priority: 1
          label: 诊断报告完成
        - to: 完成
          condition: { verdict: conditional_pass }
          priority: 2
          label: 报告有瑕疵但仍可用
        - to: 完成
          condition: { verdict: fail }
          priority: 3
          label: 报告生成失败，输出已有内容

    # ========== 终止状态：完成 ==========
    - name: 完成
      description: 诊断流程完成
      isInitial: false
      isFinal: true
      position: { x: 1350, y: 200 }
      steps:
        - id: diagnosis-complete
          name: 诊断完成
          agent: diagnosis-completer
          role: defender
          task: |
            诊断流程完成，输出最终总结：
            1. 诊断报告路径（完整报告可通过 GET /api/runs/{runId}/step-logs?step=报告沉淀-生成诊断报告 获取）
            2. 根因结论摘要
            3. 修复建议摘要
            4. 后续行动建议
            5. 明确修复验证状态；如果前序报告标记为 skipped 或 needs_runtime_validation，不得表述为已解决。
            6. 【磁盘清理】输出最终总结后，执行以下清理命令删除本次 run clone 的仓库目录以回收磁盘空间（诊断报告和状态已持久化到 ~/.aceharness/runs/，不受影响）：
               rm -rf repo/
               清理失败不影响诊断结论，在输出中标注清理结果即可。
      transitions: []

    # ========== 终止状态：终止 ==========
    - name: 终止
      description: 诊断流程异常终止
      isInitial: false
      isFinal: true
      position: { x: 100, y: 450 }
      steps:
        - id: diagnosis-abort
          name: 终止记录
          agent: diagnosis-completer
          role: defender
          task: |
            记录诊断终止原因和已有分析记录。
            然后执行磁盘清理，删除本次 run clone 的仓库目录：
            rm -rf repo/
            清理失败不影响终止记录，在输出中标注清理结果即可。
      transitions: []

context:
  # 诊断目标的工程目录：被诊断 Issue 所在的真实代码仓由 agent 在 cwd 内
  # `git clone ... repo/` 拉取。这里 projectRoot 仅作为 isolated-copy 的
  # 复制源（_template/），实际 agent 工作目录 = `<personalDir>/<runId>/`。
  # personalDir 来自 `~/.aceharness/data/users.json` 当前用户，由 engine
  # 启动时动态注入到 `_userPersonalDir`，本字段使用相对路径
  # `path.resolve(_userPersonalDir, projectRoot)` 即可正确拼到用户目录。
  # 不要在仓库内硬编码任何用户级绝对路径。
  projectRoot: "_template"
  workspaceMode: isolated-copy
  requirements: |
    OHOS 跨平台框架（Flutter-OHOS / React Native-OHOS / KMP-CMP 等）鸿蒙化问题诊断与解决。
    输入：一个 GitCode/GitHub Issue 链接（通过 globalContext 传入）。
    工作流自动从 Issue 链接获取问题描述、复现步骤、环境信息等全部内容。
    输出：结构化诊断报告 + 修复建议。
    支持问题类型：稳定性、内存泄漏、功能、性能、渲染。
    支持问题层面：应用层、插件层、框架层、引擎层、系统层。
