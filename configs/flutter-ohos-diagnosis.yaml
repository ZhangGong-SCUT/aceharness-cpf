workflow:
  name: 鸿蒙跨平台框架问题AI自动诊断
  description: |
    面向 OHOS 跨平台框架（Flutter-OHOS / React Native-OHOS / KMP-CMP 等）鸿蒙化场景的问题诊断与解决。
    精简版：分类定界(1步) → 信息采集(2步) → 根因分析(1步) → 修复建议(2步红蓝) → 报告沉淀(1步) → 完成。
    优化：去掉问题复现、裁决步骤、代码修改阶段，聚焦诊断和修复建议。
  mode: state-machine
  maxTransitions: 20
  supervisor:
    enabled: true
    agent: default-supervisor
    stageReviewEnabled: true
    checkpointAdviceEnabled: true
    scoringEnabled: true
    experienceEnabled: true

  states:
    # ========== 状态1：分类定界（1步，无裁决）==========
    - name: 分类定界
      description: |
        问题分类与定界，确定问题类型、层面、优先级。
        单步完成，无需裁决——分类结果对不对到根因分析阶段自然验证。
      requireHumanApproval: false
      isInitial: true
      isFinal: false
      position: { x: 100, y: 200 }
      steps:
        - id: classify-problem
          name: 问题分类定界
          agent: diagnosis-classifier
          role: defender
          task: |
            globalContext 中包含一个 GitCode/GitHub Issue 链接。请按以下步骤执行：
            1. 从 globalContext 中提取 Issue 链接
            2. 获取 Issue 内容：
               - GitCode 链接必须按顺序尝试：Gitea API v5 `https://gitcode.com/api/v5/repos/{owner}/{repo}/issues/{number}` → comments API → 带 Cookie/登录态的请求（如当前环境可用）→ 用户人工导出的 Issue 正文/评论
               - GitHub 链接优先使用 GitHub API；页面抓取仅作为兜底
               - 如果 webfetch 只返回 SPA 空壳（如 `<div id="app">`），不得据此判定 Issue 无内容，必须改用 API 或明确记录获取失败原因
               - 若 Issue 正文、评论、截图、日志任一关键材料缺失，必须设置 issue_content_complete=false，并在 missing_evidence 写明对后续根因置信度的影响
            3. 从 Issue 内容中提取问题现象、触发条件、复现概率、影响范围
            4. 匹配问题类型（稳定性/内存泄漏/功能/性能/渲染）
            5. 判断问题层面（应用层/插件层/框架层/引擎层/系统层）
            6. 评估优先级（P0-P3）
            7. 给出初步排查方向
            参考 flutter-ohos-issue-analysis Skill 的问题类型识别表。
            输出 JSON 格式的分类结果，包含 verdict、summary、artifact_path、key_findings、problem_type、layer、priority、confidence、initial_direction、issue_fetch_method、issue_content_complete、missing_evidence。
            注意：如果 Issue 中提到了修复 PR 或上游仓库地址，也记录下来供下游 Agent 使用。
            输出不超过 2000 字。
      transitions:
        - to: 信息采集
          condition: { verdict: pass }
          priority: 1
          label: 分类完成，进入信息采集
        - to: 信息采集
          condition: { verdict: conditional_pass }
          priority: 2
          label: 分类有不确定项，但仍进入信息采集
        - to: 终止
          condition: { verdict: fail }
          priority: 3
          label: 问题描述不足，终止诊断

    # ========== 状态2：信息采集（仅拉取代码仓）==========
    - name: 信息采集
      description: |
        拉取代码仓到本地，供下游根因分析使用。
      requireHumanApproval: false
      isInitial: false
      isFinal: false
      position: { x: 350, y: 200 }
      steps:
        - id: clone-repo
          name: 代码仓拉取
          agent: diagnosis-repo-cloner
          role: defender
          task: |
            从 Issue 内容或分类结果中识别代码仓库 URL 和分支，执行 shallow clone 到本地。
            1. 从上游分类结果或 Issue 内容中识别仓库 URL
            2. 推断目标分支（优先从 Issue 标题/内容推断版本号，无法推断则用默认分支）
            3. 执行 shallow clone：git clone --depth=1 -b <branch> <url> repo/
               如果指定分支不存在，回退到默认分支
            4. 验证 clone 成功，列出关键文件路径
            输出本地代码路径（repo/）供下游 Agent 使用。
            输出结尾必须包含 JSON：verdict、summary、artifact_path、key_findings、repo_path、branch、commit、missing_evidence。
            输出不超过 2000 字。
      transitions:
        - to: 根因分析
          condition: { verdict: pass }
          priority: 1
          label: 信息采集完成，进入根因分析
        - to: 根因分析
          condition: { verdict: conditional_pass }
          priority: 2
          label: 信息不完整但仍可继续分析
        - to: 终止
          condition: { verdict: fail }
          priority: 3
          label: 采集失败，终止诊断

    # ========== 状态3：根因分析（1步，无裁决，含兜底逻辑）==========
    - name: 根因分析
      description: |
        综合素材包，定位根本原因。
        单步完成——如果置信度<0.3，Agent自行输出排查思路（兜底逻辑内联）。
      requireHumanApproval: false
      isInitial: false
      isFinal: false
      position: { x: 600, y: 200 }
      maxSelfTransitions: 2
      steps:
        - id: analyze-root-cause
          name: 根因定位
          agent: diagnosis-root-cause-analyzer
          role: defender
          task: |
            综合素材包，定位根本原因：
            1. 执行日志分析、代码审查、差异对比
            2. 匹配已知根因模式
            3. 输出根因假设 + 证据链 + 置信度
            4. 如果置信度<0.3，直接在输出中包含兜底排查思路（可疑方向、验证步骤、缺失信息清单）
            5. 必须区分 confirmed（已由 Issue/API/日志/代码直接证明）、inferred（基于代码和平台差异推断）、unverified（待运行时验证）；不得把未验证的症状解释写成事实。
            6. 【硬约束】不得追踪 Issue 所在仓库的上游仓库信息。例如 Issue 在 openharmony-tpc/flutter_flutter，不得去查 flutter/flutter 主仓库的 PR/Issue/代码。允许使用 webfetch 获取 Issue 正文、评论等非上游仓库信息。
            7. 如果根因分析需要参考上游信息，必须以 upstream_status="unknown" + upstream_search_keywords（供用户手动搜索的关键词）形式输出，不得给出确定的 PR/Issue 链接，不得自行推断上游仓库地址。
            参考 flutter-ohos-issue-analysis Skill 的 issue-types/*.md 和 references/log-interpretation.md。
            输出 JSON 或 Markdown+JSON 均可，但结尾必须包含 verdict、summary、artifact_path、key_findings、confidence、confirmed_evidence、inferred_evidence、missing_evidence、upstream_status（只能为 "unknown"）、upstream_search_keywords。
            输出不超过 2000 字。
      transitions:
        - to: 修复建议
          condition: { verdict: pass }
          priority: 1
          label: 根因确定，进入修复建议
        - to: 修复建议
          condition: { verdict: conditional_pass }
          priority: 2
          label: 根因有不确定项，但仍可给出修复建议
        - to: 报告沉淀
          condition: { verdict: fail }
          priority: 3
          label: 根因无法确定，直接生成报告（含兜底排查思路）

    # ========== 状态4：修复建议（1步，无裁决）==========
    - name: 修复建议
      description: |
        基于确认的根因，提出修复方案。单步完成，无需裁决。
      requireHumanApproval: false
      isInitial: false
      isFinal: false
      position: { x: 850, y: 200 }
      maxSelfTransitions: 2
      steps:
        - id: design-fix
          name: 修复方案设计
          agent: diagnosis-fix-advisor
          role: defender
          task: |
            基于确认的根因，设计系统性修复方案：
            1. 根据根因层面选择修复策略
            2. 不追踪 Issue 所在仓库的上游仓库信息（如 Issue 在 openharmony-tpc/flutter_flutter，不要去查 flutter/flutter 主仓库的 PR/Issue），仅生成「用户手动跟踪」用的 issue 标题/正文模板与 PR 检索关键词
            3. 生成短期修复 + 根因修复 + 长期改进 + 上游协同（仅模板）的完整建议
            4. 评估修复风险和影响范围
            5. 明确哪些修复依据已验证、哪些依赖运行时补充验证；未编译/未运行时不得声称修复已验证。
            输出结尾必须包含 verdict、summary、artifact_path、key_findings、fix_strategy、risk_level、verification_status、missing_evidence、upstream_status（只能为 unknown）。
            upstream_collaboration.upstream_status 必须填 "unknown"，不得进行实际网络查询。
            输出不超过 2000 字。
      transitions:
        - to: 报告沉淀
          condition: { verdict: pass }
          priority: 1
          label: 修复方案完成，进入报告沉淀
        - to: 修复建议
          condition: { verdict: conditional_pass }
          priority: 2
          label: 修复方案需调整
        - to: 报告沉淀
          condition: { verdict: fail }
          priority: 3
          label: 修复方案驳回，输出建议供人工执行

    # ========== 状态5：报告沉淀（1步，无裁决）==========
    - name: 报告沉淀
      description: |
        生成结构化诊断报告。单步完成，无需裁决——报告质量在内容本身，不需要额外裁决步骤。
      requireHumanApproval: false
      isInitial: false
      isFinal: false
      position: { x: 1100, y: 200 }
      steps:
        - id: generate-report
          name: 生成诊断报告
          agent: diagnosis-reporter
          role: defender
          task: |
            收集全流程上下文，生成结构化诊断报告：
            1. 按标准模板生成报告（问题概述、环境信息、复现步骤、分析过程、根因结论、修复建议、验证建议、知识沉淀）
            2. 提取知识更新
            3. 评估诊断质量
            4. 写入报告文件
            5. 报告中必须显式区分：已确认事实、静态代码推断、待运行时验证项；对 Issue 未直接说明的具体表现，只能写为“推测/可能”，不能写成已验证事实。
            6. 报告必须包含 Issue 获取完整性、缺失证据及影响；若正文/评论/截图/日志缺失，报告不得给出“已验证解决”结论。
            7. 写入报告后，在最终输出末尾追加可解析 JSON：
               `{"verdict":"pass|conditional_pass|fail","summary":"...","artifact_path":"outputs/...md","key_findings":[...],"report_path":"outputs/...md","verification_status":"verified|skipped|needs_runtime_validation","missing_evidence":[...]}`
            参考 flutter-ohos-issue-analysis Skill 的 references/report-template.md 报告模板。
            输出不超过 2000 字。
      transitions:
        - to: 完成
          condition: { verdict: pass }
          priority: 1
          label: 诊断报告完成
        - to: 完成
          condition: { verdict: conditional_pass }
          priority: 2
          label: 报告有瑕疵但仍可用
        - to: 完成
          condition: { verdict: fail }
          priority: 3
          label: 报告生成失败，输出已有内容

    # ========== 终止状态：完成 ==========
    - name: 完成
      description: 诊断流程完成
      isInitial: false
      isFinal: true
      position: { x: 1350, y: 200 }
      steps:
        - id: diagnosis-complete
          name: 诊断完成
          agent: diagnosis-completer
          role: defender
          task: |
            诊断流程完成，输出最终总结：
            1. 诊断报告路径
            2. 根因结论摘要
            3. 修复建议摘要
            4. 后续行动建议
            5. 明确修复验证状态；如果前序报告标记为 skipped 或 needs_runtime_validation，不得表述为已解决。
            输出不超过 1000 字。
      transitions: []

    # ========== 终止状态：终止 ==========
    - name: 终止
      description: 诊断流程异常终止
      isInitial: false
      isFinal: true
      position: { x: 100, y: 450 }
      steps:
        - id: diagnosis-abort
          name: 终止记录
          agent: diagnosis-completer
          role: defender
          task: |
            记录诊断终止原因和已有分析记录。
            输出不超过 1000 字。
      transitions: []

context:
  projectRoot: ""
  workspaceMode: in-place
  requirements: |
    OHOS 跨平台框架（Flutter-OHOS / React Native-OHOS / KMP-CMP 等）鸿蒙化问题诊断与解决。
    输入：一个 GitCode/GitHub Issue 链接（通过 globalContext 传入）。
    工作流自动从 Issue 链接获取问题描述、复现步骤、环境信息等全部内容。
    输出：结构化诊断报告 + 修复建议 + 知识沉淀。
    支持问题类型：稳定性、内存泄漏、功能、性能、渲染。
    支持问题层面：应用层、插件层、框架层、引擎层、系统层。
    核心特色：上游社区追踪（PR追溯）、兜底诊断、红蓝对抗修复建议。
  timeoutMinutes: 60
  gitBaselineEnabled: true
  executionPolicy:
    defaultEngine: opencode
    defaultModel: minimax-cn/MiniMax-M3
  skills:
    - flutter-ohos-issue-analysis
