# 本机 OHOS Flutter SDK 清单。诊断按 repo/ 分支对号入座，禁止用对不上的日常 SDK 凑真机。
# 只登记「装好的 SDK」（有 bin/flutter + bin/cache 引擎产物），不要登记 git clone 的纯源码仓。
# 路径按你机器改。没有的版本先空着或删掉；对不上时工作流会 engine_aligned=false，不得 pass。

dailySdk: D:\a_flutter\flutter_flutter
sdkRoot: D:\flutter-sdks

sdks:
  - id: 3.22.3-ohos
    version: 3.22.3
    aliases:
      - 3.22.3-ohos
      - 3.22.3
      - oh-3.22.3-dev
      - oh-3.22.3-release
      - oh-3.22.3
    path: D:\flutter-sdks\3.22.3-ohos
  - id: 3.27.5-ohos
    version: 3.27.5
    aliases:
      - 3.27.5-ohos
      - 3.27.5
      - 3.27.4
      - 3.27.4-ohos
      - oh-3.27
      - oh-3.27.4-dev
      - br_3.27.4-ohos
    path: D:\a_flutter\flutter_flutter
  - id: 3.35.7-ohos
    version: 3.35.7
    aliases:
      - 3.35.7-ohos
      - 3.35.7
      - 3.35.8
      - 3.35.8-ohos
