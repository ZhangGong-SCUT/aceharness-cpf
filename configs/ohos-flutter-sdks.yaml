# 本机 OHOS Flutter SDK 清单。诊断按 repo/ 分支对号入座，禁止用对不上的日常 SDK 凑真机。
# 只登记「装好的 SDK」（有 bin/flutter + bin/cache 引擎产物），不要登记 git clone 的纯源码仓。
# 路径按你机器改。没有的版本先空着或删掉；对不上时工作流会 engine_aligned=false，不得 pass。
#
# 本机（Linux /home/flutter）已装 5 个版本，全部来自 CPF-Flutter/flutter_flutter 对应 dev 分支
# 浅克隆 + `flutter precache --ohos`（2026-09-06 安装，HAR 产物已通过 gzip CRC 校验）。
# dailySdk 不配置：本机没有日常开发 SDK，5 个 SDK 全部是工作流专用。

sdkRoot: /home/flutter/flutter-sdks

sdks:
  - id: 3.22.3-ohos
    version: 3.22.3
    aliases:
      - 3.22.3-ohos
      - 3.22.3
      - oh-3.22.3-dev
      - oh-3.22.3-release
      - oh-3.22.3
    path: /home/flutter/flutter-sdks/3.22.3-ohos
  - id: 3.27.4-ohos
    version: 3.27.4
    aliases:
      - 3.27.4-ohos
      - 3.27.4
      - 3.27.5
      - 3.27.5-ohos
      - oh-3.27
      - oh-3.27.4-dev
      - br_3.27.4-ohos
    path: /home/flutter/flutter-sdks/3.27.4-ohos
  - id: 3.35.7-ohos
    version: 3.35.7
    aliases:
      - 3.35.7-ohos
      - 3.35.7
      - 3.35.8
      - 3.35.8-ohos
      - oh-3.35.7-release
