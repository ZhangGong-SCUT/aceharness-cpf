workflow:
  name: GitCode 自己的 PR 自修
  description: |
    只处理作者白名单在监听仓上仍开着的 PR。
    按 OpenHarmony DCP 标签和 openharmony_ci 评论分类：DCO / 静态检查 / 编译 / AI 检视。
    修好后 push 到 fork 分支并评论 start build，再挂起等下一次 Webhook。
    测试失败停下来问人。禁止自动评论 submit，禁止合入。
  mode: state-machine
  maxTransitions: 60
  supervisor:
    enabled: true
    agent: default-supervisor
    stageReviewAsync: true
    stageReviewEnabled: true
    checkpointAdviceEnabled: true
    scoringEnabled: true
    experienceEnabled: true

  states:
    - name: 识别
      description: 解析 PR，确认白名单作者、监听仓、fork 分支，已关闭则停。
      isInitial: true
      maxSelfTransitions: 2
      position: { x: 80, y: 80 }
      steps:
        - id: identify-pr
          name: 识别PR
          agent: developer
          role: defender
          task: |
            从 globalContext 解析 pr_url / owner / repo / number / author / head_ref / head_repo / base_ref。禁止编造。
            作者必须在 ACE_GITCODE_PR_AUTHOR 白名单。仓必须在 ACE_GITCODE_WATCH_REPOS（若已配置）。
            已关闭或已合入 → fail。缺字段 → conditional_pass。齐全 → pass。
            输出 JSON：verdict、summary、pr_url、author、head_repo、head_ref、own_pr。
        - id: challenge-identify
          name: 质疑识别
          agent: code-hunter
          role: attacker
          task: 质疑是否编造了 PR 号、是否把别人的 PR 当成自己的、是否漏了 head_repo。输出 <step-conclusion>。
        - id: judge-identify
          name: 识别裁决
          agent: code-judge
          role: judge
          task: |
            pass：进入等待门禁。conditional_pass：继续识别。fail：终止。
            输出 <step-conclusion>：verdict、summary、next_state。
      transitions:
        - to: 等待门禁
          condition: { verdict: pass }
          priority: 1
          label: 是白名单作者的开着的 PR
        - to: 识别
          condition: { verdict: conditional_pass }
          priority: 2
          label: 字段不全，补解析
        - to: 终止
          condition: { verdict: fail }
          priority: 3
          label: 他人 PR / 已关闭 / 未监听仓

    - name: 等待门禁
      description: 拉标签和 openharmony_ci 评论，写出 gate-check.json。还在跑则挂起，不要空转。
      maxSelfTransitions: 1
      position: { x: 360, y: 80 }
      steps:
        - id: check-pr-gates
          name: 检查门禁
          agent: developer
          role: defender
          task: |
            按 gitcode-pr-review Skill 检查 OpenHarmony DCP 门禁，不要请求 /commits/{sha}/status。
            1. node skills/gitcode-pr-review/scripts/check-pr-gates.mjs --pr-url <PR_URL> --out outputs
            2. 读 outputs/gate-check.json 的 phase
            3. phase=running → conditional_pass，准备挂起等 Webhook，禁止 sleep 空等
            4. 已关闭/不是自己的 PR → fail
            5. 其余 phase → pass，交给分类处置
            欢迎评论没到之前不要 start build。不要等 AI已检视 才往下走。
            输出 JSON：verdict、phase、summary、artifact_path。
        - id: challenge-pr-gates
          name: 质疑门禁
          agent: code-hunter
          role: attacker
          task: |
            质疑是否把 commit status 404 当成通过、是否把静态检查失败当成编译失败、是否在没欢迎评论时抢 start build。
            输出 <step-conclusion>。
        - id: judge-pr-gates
          name: 门禁裁决
          agent: code-judge
          role: judge
          task: |
            pass：有可分类结论，去分类处置。
            conditional_pass：还在跑，去挂起。
            fail：已关闭或不是自己的 PR，终止。
            输出 <step-conclusion>：verdict、phase、next_state。
      transitions:
        - to: 分类处置
          condition: { verdict: pass }
          priority: 1
          label: 有门禁结论，去分流
        - to: 挂起
          condition: { verdict: conditional_pass }
          priority: 2
          label: CI 还在跑，挂起等 Webhook
        - to: 终止
          condition: { verdict: fail }
          priority: 3
          label: 已关闭或不是自己的 PR

    - name: 挂起
      description: 停在这里等 GitCode Webhook 叫醒，不要用 Agent 空转。
      requireHumanApproval: true
      maxSelfTransitions: 1
      position: { x: 640, y: 80 }
      steps:
        - id: park-gate-wait
          name: 记录挂起
          agent: documentation-writer
          role: defender
          task: |
            记录当前 phase=running，等待下一次 Merge Request / Note Webhook。
            不要 sleep，不要再跑三个 Agent 等 60 分钟。不要评论 submit。
            verdict=pass。输出 JSON：verdict、summary、waiting_for=webhook。
      transitions:
        - to: 等待门禁
          condition: { verdict: pass }
          priority: 1
          label: Webhook 或人工唤醒后重新拉门禁
        - to: 挂起
          condition: { verdict: conditional_pass }
          priority: 2
          label: 仍需等待
        - to: 终止
          condition: { verdict: fail }
          priority: 3
          label: 不再等待

    - name: 分类处置
      description: 脚本分流。优先级 DCO → 静态检查 → 编译 → AI 检视 → 测试。
      maxSelfTransitions: 1
      position: { x: 80, y: 260 }
      steps:
        - id: route-phase
          name: 按phase分流
          agent: developer
          role: defender
          task: |
            只跑脚本，不要猜 phase。
            node skills/gitcode-pr-review/scripts/route-pr-phase.mjs --from 分类处置 --in outputs/gate-check.json
            把脚本输出的 verdict / next_state 原样写入结尾 JSON。禁止改 phase。
      transitions:
        - to: 分流静态
          condition: { verdict: pass }
          priority: 1
          label: 不是 DCO 失败，继续看静态检查
        - to: 挂起
          condition: { verdict: conditional_pass }
          priority: 2
          label: 仍在跑
        - to: DCO修复
          condition: { verdict: fail }
          priority: 3
          label: DCO 失败

    - name: 分流静态
      description: phase=static_failed 则进静态修复。
      maxSelfTransitions: 1
      position: { x: 280, y: 260 }
      steps:
        - id: route-static
          name: 分流静态检查
          agent: developer
          role: defender
          task: |
            node skills/gitcode-pr-review/scripts/route-pr-phase.mjs --from 分流静态 --in outputs/gate-check.json
            原样输出 verdict / next_state。静态检查失败时即使编译 pending 也 fail。
      transitions:
        - to: 分流编译
          condition: { verdict: pass }
          priority: 1
        - to: 挂起
          condition: { verdict: conditional_pass }
          priority: 2
        - to: 静态修复
          condition: { verdict: fail }
          priority: 3

    - name: 分流编译
      description: phase=compile_failed 则进编译修复。
      maxSelfTransitions: 1
      position: { x: 480, y: 260 }
      steps:
        - id: route-compile
          name: 分流编译
          agent: developer
          role: defender
          task: |
            node skills/gitcode-pr-review/scripts/route-pr-phase.mjs --from 分流编译 --in outputs/gate-check.json
            原样输出 verdict / next_state。
      transitions:
        - to: 分流测试
          condition: { verdict: pass }
          priority: 1
        - to: 挂起
          condition: { verdict: conditional_pass }
          priority: 2
        - to: 编译修复
          condition: { verdict: fail }
          priority: 3

    - name: 分流测试
      description: 测试失败或说不清则人工确认，不要自动改。
      maxSelfTransitions: 1
      position: { x: 680, y: 260 }
      steps:
        - id: route-test
          name: 分流测试
          agent: developer
          role: defender
          task: |
            node skills/gitcode-pr-review/scripts/route-pr-phase.mjs --from 分流测试 --in outputs/gate-check.json
            原样输出 verdict / next_state。test_failed / unknown / blocked_no_issue 必须 fail。
      transitions:
        - to: 分流检视
          condition: { verdict: pass }
          priority: 1
        - to: 挂起
          condition: { verdict: conditional_pass }
          priority: 2
        - to: 人工确认
          condition: { verdict: fail }
          priority: 3

    - name: 分流检视
      description: 有未处理的 AI 检视意见才进检视修复。
      maxSelfTransitions: 1
      position: { x: 880, y: 260 }
      steps:
        - id: route-review
          name: 分流检视
          agent: developer
          role: defender
          task: |
            运行 skills/gitcode-pr-review/scripts/fetch-ai-review.mjs --pr-url <PR_URL> --out outputs
            若 outputs/ai-review-comments.json 的 actionable_count>0：verdict=fail，next_state=检视修复。
            否则跑 route-pr-phase.mjs --from 分流检视，原样输出。只有 AI已检视 标签没有意见正文时不要空改。
      transitions:
        - to: 分流触发
          condition: { verdict: pass }
          priority: 1
        - to: 挂起
          condition: { verdict: conditional_pass }
          priority: 2
        - to: 检视修复
          condition: { verdict: fail }
          priority: 3

    - name: 分流触发
      description: 需要第一次 start build 则去推送并触发；全绿去就绪。
      maxSelfTransitions: 1
      position: { x: 1080, y: 260 }
      steps:
        - id: route-trigger
          name: 分流触发
          agent: developer
          role: defender
          task: |
            node skills/gitcode-pr-review/scripts/route-pr-phase.mjs --from 分流触发 --in outputs/gate-check.json
            phase=need_start_build → fail 去推送并触发。
            工作区若有未提交改动也 fail 去推送。
            否则 pass 去就绪。不要评论 submit。
      transitions:
        - to: 就绪
          condition: { verdict: pass }
          priority: 1
        - to: 挂起
          condition: { verdict: conditional_pass }
          priority: 2
        - to: 推送并触发
          condition: { verdict: fail }
          priority: 3

    - name: DCO修复
      description: 只补 Signed-off-by，不改业务代码。
      maxSelfTransitions: 3
      position: { x: 80, y: 460 }
      steps:
        - id: fix-dco
          name: 补DCO
          agent: developer
          role: defender
          task: |
            checkout fork 的 head_ref 到 repo/；已有则 fetch，不要每次全量 clone。
            只给缺失的 commit 补 Signed-off-by: Name <email>。不要改业务代码。本状态不要 git commit / git push。
            输出 JSON：verdict、summary、fixed_commits。
        - id: challenge-dco
          name: 质疑DCO
          agent: code-hunter
          role: attacker
          task: 检查是否改了无关代码、是否漏补 Signed-off-by。输出 <step-conclusion>。
        - id: judge-dco
          name: DCO裁决
          agent: code-judge
          role: judge
          task: pass 去推送并触发。conditional_pass 继续补。fail 去人工确认。输出 next_state。
      transitions:
        - to: 推送并触发
          condition: { verdict: pass }
          priority: 1
        - to: DCO修复
          condition: { verdict: conditional_pass }
          priority: 2
        - to: 人工确认
          condition: { verdict: fail }
          priority: 3

    - name: 静态修复
      description: 对着 codeCheck / 静态检查报告改，不要当成编译失败。
      maxSelfTransitions: 3
      position: { x: 280, y: 460 }
      steps:
        - id: fix-static
          name: 修静态检查
          agent: developer
          role: defender
          task: |
            checkout fork head_ref 到 repo/。对着 gate-check.json 的 report_url / 静态检查失败日志改。
            不要在本机编 Flutter/OH 全量工程。本状态不要 git commit / git push。
            修不好则 conditional_pass 并写清缺哪份 DCP 日志。
            输出 JSON：verdict、summary、fixed_files。
        - id: challenge-static
          name: 质疑静态修复
          agent: code-hunter
          role: attacker
          task: 检查是否对着静态检查报告改、有没有改去修编译。输出 <step-conclusion>。
        - id: judge-static
          name: 静态修复裁决
          agent: code-judge
          role: judge
          task: pass 去推送并触发。conditional_pass 继续改。fail 去人工确认。
      transitions:
        - to: 推送并触发
          condition: { verdict: pass }
          priority: 1
        - to: 静态修复
          condition: { verdict: conditional_pass }
          priority: 2
        - to: 人工确认
          condition: { verdict: fail }
          priority: 3

    - name: 编译修复
      description: 对着 DCP 编译失败日志改。
      maxSelfTransitions: 3
      position: { x: 480, y: 460 }
      steps:
        - id: fix-compile
          name: 修编译
          agent: developer
          role: defender
          task: |
            checkout fork head_ref 到 repo/。对着 DCP 编译失败日志改导致失败的文件。
            不要在步骤里编 Flutter/OH 全量工程。本状态不要 git commit / git push。
            输出 JSON：verdict、summary、fixed_files、remaining_errors。
        - id: challenge-compile
          name: 质疑编译修复
          agent: code-hunter
          role: attacker
          task: 检查是否对着编译日志改、有没有漏修同类报错。输出 <step-conclusion>。
        - id: judge-compile
          name: 编译修复裁决
          agent: code-judge
          role: judge
          task: pass 去推送并触发。conditional_pass 继续改。fail 去人工确认。
      transitions:
        - to: 推送并触发
          condition: { verdict: pass }
          priority: 1
        - to: 编译修复
          condition: { verdict: conditional_pass }
          priority: 2
        - to: 人工确认
          condition: { verdict: fail }
          priority: 3

    - name: 检视修复
      description: 按 PR 上已有 AI 检视意见改。没有意见不要空改。
      maxSelfTransitions: 3
      position: { x: 880, y: 460 }
      steps:
        - id: apply-ai-review
          name: 按AI检视修改
          agent: developer
          role: defender
          task: |
            运行 skills/gitcode-pr-review/scripts/fetch-ai-review.mjs --pr-url <PR_URL> --out outputs
            actionable_count=0：不要空改，verdict=pass。
            有意见：在 repo/ 按 path/line 改，只改检视点到的文件。本状态不要 git commit / git push。
            输出 JSON：verdict、summary、applied_issues。
        - id: challenge-ai-review
          name: 质疑检视修复
          agent: code-hunter
          role: attacker
          task: 检查是否漏掉必须改的检视项，或改了检视没要求的范围。输出 <step-conclusion>。
        - id: judge-ai-review
          name: 检视修复裁决
          agent: fix-reviewer
          role: judge
          task: pass 去推送并触发。conditional_pass 继续改。fail 去人工确认。
      transitions:
        - to: 推送并触发
          condition: { verdict: pass }
          priority: 1
        - to: 检视修复
          condition: { verdict: conditional_pass }
          priority: 2
        - to: 人工确认
          condition: { verdict: fail }
          priority: 3

    - name: 推送并触发
      description: commit（含 DCO）push 到 fork，再评论恰好一行 start build。禁止 submit。
      maxSelfTransitions: 3
      position: { x: 1080, y: 460 }
      steps:
        - id: push-and-start-build
          name: 推送并start-build
          agent: developer
          role: defender
          task: |
            1. git -C repo status。无改动且 gate-check.json 的 phase 不是 need_start_build：不要空 commit，也不要空评论 start build，verdict=pass
            2. 有改动：git -C repo diff > outputs/fix.patch。commit 写清修的是静态/编译/DCO/检视，必须带 Signed-off-by，可用 git commit -s
            3. push 到 head_repo 的 head_ref（fork remote），禁止 --force
            4. 推送成功后，或 phase=need_start_build：node skills/gitcode-pr-review/scripts/post-pr-comment.mjs --pr-url <PR_URL> --body "start build" --out outputs
            5. 禁止评论 submit，禁止合入
            6. 推送失败则 conditional_pass
            输出 JSON：verdict、summary、push_status、start_build、dco。
        - id: challenge-push
          name: 质疑推送
          agent: code-hunter
          role: attacker
          task: 检查是否推错成上游仓、是否 force push、是否漏 DCO、是否误评论了 submit。输出 <step-conclusion>。
        - id: judge-push
          name: 推送裁决
          agent: code-judge
          role: judge
          task: pass 回等待门禁。conditional_pass 重试。fail 去人工确认。禁止把完成写成已合入。
      transitions:
        - to: 等待门禁
          condition: { verdict: pass }
          priority: 1
          label: 已 start build 或无需推送，回去等门禁
        - to: 推送并触发
          condition: { verdict: conditional_pass }
          priority: 2
        - to: 人工确认
          condition: { verdict: fail }
          priority: 3

    - name: 就绪
      description: 门禁标签已绿。通知人去评审、解讨论、自己评论 submit。
      maxSelfTransitions: 1
      position: { x: 1080, y: 80 }
      steps:
        - id: mark-ready
          name: 标记就绪
          agent: documentation-writer
          role: defender
          task: |
            工作区还有未推改动 → fail，去推送并触发。
            否则 pass。摘要写清 PR 链接、门禁、改了什么、是否已 start build。
            写明：未 submit、未合入。不要评论 submit。
            输出 JSON：verdict、summary、pr_url、submitted=false、merged=false。
      transitions:
        - to: 完成
          condition: { verdict: pass }
          priority: 1
        - to: 挂起
          condition: { verdict: conditional_pass }
          priority: 2
        - to: 推送并触发
          condition: { verdict: fail }
          priority: 3

    - name: 人工确认
      description: 测试失败、报告打不开、推送无权限等，停下来问人。
      requireHumanApproval: true
      maxSelfTransitions: 1
      position: { x: 680, y: 640 }
      steps:
        - id: ask-human
          name: 记录需人工确认
          agent: documentation-writer
          role: defender
          task: |
            写清终止或待确认原因：测试失败 / 未关联 Issue / 报告打不开 / 推送无权限 / 轮次用尽。
            不要自动改测试代码，不要 submit。默认 verdict=pass 进入终止。
            若人要求继续等门禁，用 conditional_pass。
      transitions:
        - to: 终止
          condition: { verdict: pass }
          priority: 1
        - to: 等待门禁
          condition: { verdict: conditional_pass }
          priority: 2
        - to: 终止
          condition: { verdict: fail }
          priority: 3

    - name: 完成
      description: 门禁已绿，等人评审并自己评论 submit。
      isFinal: true
      position: { x: 1280, y: 80 }
      steps:
        - id: complete-pr-self-heal
          name: 汇总结果
          agent: documentation-writer
          role: defender
          task: |
            汇总 PR 链接、phase、是否 push、是否 start build。未 submit、未合入不要写成已合入。
            输出 JSON：verdict、summary、pr_url、submitted=false。
      transitions: []

    - name: 终止
      description: 不是自己的 PR，或无法安全自动修。
      isFinal: true
      position: { x: 80, y: 640 }
      steps:
        - id: abort-pr-self-heal
          name: 记录终止原因
          agent: documentation-writer
          role: defender
          task: 记录终止原因（他人 PR / 已关闭 / 测试失败 / 缺日志 / 无法推送 / 轮次用尽）和已有产物。
      transitions: []

context:
  projectRoot: "_template"
  workspaceMode: isolated-copy
  requirements: |
    只处理作者白名单的 GitCode PR。门禁看标签和 openharmony_ci 评论。
    按 DCO / 静态检查 / 编译 / AI 检视分流修复，push 到 fork 后评论 start build。
    测试失败人工确认。禁止自动 submit 和合入。
  timeoutMinutes: 180
  gitBaselineEnabled: false
  skills:
    - gitcode-pr-review
