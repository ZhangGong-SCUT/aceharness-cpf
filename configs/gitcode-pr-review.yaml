workflow:
  name: GitCode 自己的 PR 自修
  description: |
    只处理"自己的 PR"（白名单作者，或 AIWeb 手动开启者本人）在监听仓上仍开着的 PR。
    按 OpenHarmony DCP 标签和 openharmony_ci 评论分类：DCO / 静态检查 / 编译 / AI 检视。
    修好后 push 到 fork 分支并评论 start build，再挂起等下一次 Webhook。
    测试失败停下来问人。禁止自动评论 submit，禁止合入。
  mode: state-machine
  maxTransitions: 60
  supervisor:
    enabled: true
    agent: default-supervisor
    # PR 规则判定由 GitCode/DCP 脚本负责，代码修复仍保留独立质疑与裁决；
    # 关闭重复的状态级监督、人工确认建议和结束评分，减少额外 LLM 请求与终态延迟。
    stageReviewAsync: true
    stageReviewEnabled: false
    checkpointAdviceEnabled: false
    scoringEnabled: false
    experienceEnabled: false

  states:
    - name: 识别
      description: 解析 PR，确认是"自己的 PR"（白名单作者 或 manual-start-by 本人）、监听仓、fork 分支，已关闭则停。
      isInitial: true
      maxSelfTransitions: 2
      position: { x: 30, y: 80 }
      steps:
        - id: identify-pr
          prScript: identity
          name: 脚本校验PR身份
          agent: developer
          role: defender
          task: |
            运行 node skills/gitcode-pr-review/scripts/validate-pr-identity.mjs --out outputs，读取 outputs/pr-identity.json。
            该脚本只解析本次 run 的 globalContext，并确定性校验 URL、必需字段、作者准入和监听仓；不要重新推断或改写脚本结论。
            字段缺失、身份不匹配或仓库不在监听范围时按脚本 verdict 终止，不要补造信息。PR 是否仍 open/是否合入交给下一状态的门禁脚本实时检查。
            原样输出 JSON：verdict、summary、pr_url、author、head_repo、head_ref、own_pr。
      transitions:
        - to: 等待门禁
          condition: { verdict: pass }
          priority: 1
          label: 是自己的 PR（白名单或手动开启者本人）且开着
        - to: 终止
          condition: { verdict: fail }
          priority: 2
          label: 身份或输入校验失败
        - to: 人工确认
          condition: { verdict: conditional_pass }
          priority: 3
          label: 身份校验结果不确定，人工确认后再继续

    - name: 等待门禁
      description: 拉标签和 openharmony_ci 评论，写出 gate-check.json。还在跑则挂起，不要空转。
      maxSelfTransitions: 1
      position: { x: 380, y: 80 }
      steps:
        - id: check-pr-gates
          prScript: gates
          name: 检查门禁
          agent: developer
          role: defender
          task: |
            按 gitcode-pr-review Skill 检查 OpenHarmony DCP 门禁，不要请求 /commits/{sha}/status。
            脚本会自动从 run 的 state.yaml 检测 globalContext 中的 user_fix_feedback: / user_revert: / user_apply_patch: 指令行（AIWeb 用户人工指令），命中时 phase 自动覆盖为 user_fix，无需额外参数。
            脚本还会检测 outputs/review-suggestion.json（本 run 已生成的检视建议）：建议存在且 PR head 未变 → phase=review_pending_decision。
            1. node skills/gitcode-pr-review/scripts/check-pr-gates.mjs --pr-url <PR_URL> --author <author> --out outputs
            2. 读 outputs/gate-check.json 的 phase
            3. phase=running → conditional_pass，准备挂起等 Webhook，禁止 sleep 空等
            4. phase=review_pending_decision → conditional_pass 去挂起：检视建议已生成等用户在 AIWeb 决策，不要重新生成建议、不要推送、不要 start build
            5. phase=tester_approved → fail：测试人已全部通过（网页"测试人 ✓ 已通过"），PR 等待合入，监控推送代码会重置测试状态——去终止，summary 注明原因
            6. 已关闭/不是自己的 PR → fail
            7. 其余 phase → pass，交给分类处置
            有失败标签时脚本会额外拉门禁日志做根因核对，产出 outputs/gate-log-analysis.json（log_verdict / root_cause_verified / log_reasons / evidence）。
            跑测报告已可读：评论里的 download.ci.openharmony.cn 是内网别名，脚本会改写为可达镜像 cidownload.openharmony.cn 下载 report.zip 后归因——
            log_verdict=harness_env_failure（用例未跑到断言、测试环境准备失败，如切换 Flutter 版本时 worktree 同步失败）为**平台/环境侧、非 PR 代码问题**；
            log_verdict=test_assertion（run/pass/failure 计数显示真失败）为确定性问题。
            root_cause_verified=false（取不到报告时的 test_stage_unverified）时，summary 已写明"根因未验证"——向用户/评论汇报时**禁止**断言"平台抖动"，只能说"疑似基础设施超时、根因未验证"。
            欢迎评论没到之前不要 start build。不要等 AI已检视 才往下走。
            输出 JSON：verdict、phase、summary、artifact_path。
      transitions:
        - to: 分类处置
          condition: { verdict: pass }
          priority: 1
          label: 有门禁结论，去分流
        - to: 挂起
          condition: { verdict: conditional_pass }
          priority: 2
          label: CI 还在跑，挂起等 Webhook
        - to: 终止
          condition: { verdict: fail }
          priority: 3
          label: 已关闭或不是自己的 PR

    - name: 挂起
      description: 停在这里等 GitCode Webhook 叫醒，不要用 Agent 空转。
      requireHumanApproval: true
      maxSelfTransitions: 1
      position: { x: 740, y: 80 }
      steps:
        - id: park-gate-wait
          prScript: park
          name: 记录挂起
          agent: documentation-writer
          role: defender
          task: |
            记录当前 phase=running，等待下一次 Merge Request / Note Webhook。
            若 outputs/review-suggestion.json 存在（检视建议模式）：waiting_for=user_decision（用户在 AIWeb 面板决策应用/驳回/反馈），summary 注明等待用户决策。
            不要 sleep，不要再跑三个 Agent 等 60 分钟。不要评论 submit。
            verdict=pass。输出 JSON：verdict、summary、waiting_for=webhook 或 user_decision。
      transitions:
        - to: 等待门禁
          condition: { verdict: pass }
          priority: 1
          label: Webhook 或人工唤醒后重新拉门禁
        - to: 挂起
          condition: { verdict: conditional_pass }
          priority: 2
          label: 仍需等待
        - to: 终止
          condition: { verdict: fail }
          priority: 3
          label: 不再等待

    - name: 分类处置
      description: 脚本一次性分流确定性门禁。优先级 DCO → 静态检查 → 编译 → 测试；通过后再检查 AI 检视。
      maxSelfTransitions: 1
      position: { x: 380, y: 380 }
      steps:
        - id: route-phase
          prScript: route
          name: 脚本分流门禁
          agent: developer
          role: defender
          task: |
            只跑脚本，不要猜 phase。脚本会按 DCO → 静态 → 编译 → 测试的优先级一次算出 next_state。
            node skills/gitcode-pr-review/scripts/route-pr-phase.mjs --from 分类处置 --in outputs/gate-check.json
            把脚本输出的 verdict / next_state 原样写入结尾 JSON。禁止改 phase 或 next_state。
      transitions:
        - to: 分流检视
          condition: { verdict: pass, fieldEquals: { next_state: 分流检视 } }
          priority: 1
          label: 门禁修复项均无失败，检查 AI 检视
        - to: DCO修复
          condition: { verdict: fail, fieldEquals: { next_state: DCO修复 } }
          priority: 2
          label: DCO 失败
        - to: 检视修复
          condition: { verdict: fail, fieldEquals: { next_state: 检视修复 } }
          priority: 3
          label: 用户指令直接进入检视修复
        - to: 静态修复
          condition: { verdict: fail, fieldEquals: { next_state: 静态修复 } }
          priority: 4
          label: 静态检查失败
        - to: 编译修复
          condition: { verdict: fail, fieldEquals: { next_state: 编译修复 } }
          priority: 5
          label: 编译失败
        - to: 人工确认
          condition: { verdict: fail, fieldEquals: { next_state: 人工确认 } }
          priority: 6
          label: 测试失败或门禁状态不明
        - to: 挂起
          condition: { verdict: conditional_pass, fieldEquals: { next_state: 挂起 } }
          priority: 7
          label: 等待门禁更新
        - to: 人工确认
          condition: { verdict: pass }
          priority: 90
          label: 分流输出缺失时转人工确认
        - to: 人工确认
          condition: { verdict: conditional_pass }
          priority: 91
          label: 分流输出缺失时转人工确认
        - to: 人工确认
          condition: { verdict: fail }
          priority: 92
          label: 分流输出缺失时转人工确认

    - name: 分流检视
      description: 有未处理的 AI 检视意见才进检视修复。
      maxSelfTransitions: 1
      position: { x: 1820, y: 380 }
      steps:
        - id: route-review
          prScript: review
          name: 分流检视
          agent: developer
          role: defender
          task: |
            若 outputs/review-suggestion.json 存在（本 run 已生成检视建议，mode=suggestion）：不要跑 fetch-ai-review，
            直接 verdict=conditional_pass 去挂起——建议等用户在 AIWeb 面板决策（应用/驳回/反馈），不要重新生成建议。
            否则运行 skills/gitcode-pr-review/scripts/fetch-ai-review.mjs --pr-url <PR_URL> --author <author> --out outputs
            若 outputs/ai-review-comments.json 的 actionable_count>0：verdict=fail，next_state=检视修复。
            若 actionable_count=0 且 ai_reviewed=false（未被 AI 检视）：同样 verdict=fail，next_state=检视修复——
            检视修复状态会识别 ai_reviewed=false 并执行「同主题跨分支修复同步」而非常规检视修复。
            否则（actionable_count=0 且 ai_reviewed=true，检视过无问题）跑 route-pr-phase.mjs --from 分流检视，原样输出。只有 AI已检视 标签没有意见正文时不要空改。
      transitions:
        - to: 人工确认
          condition: { verdict: fail, fieldEquals: { next_state: 人工确认 } }
          priority: 0
          label: 检视接口权限不足，需要更新凭据
        - to: 分流触发
          condition: { verdict: pass }
          priority: 1
        - to: 挂起
          condition: { verdict: conditional_pass }
          priority: 2
        - to: 检视修复
          condition: { verdict: fail }
          priority: 3

    - name: 分流触发
      description: 需要第一次 start build 则去推送并触发；全绿去就绪。
      maxSelfTransitions: 1
      position: { x: 2180, y: 380 }
      steps:
        - id: route-trigger
          prScript: route
          name: 分流触发
          agent: developer
          role: defender
          task: |
            node skills/gitcode-pr-review/scripts/route-pr-phase.mjs --from 分流触发 --in outputs/gate-check.json
            phase=need_start_build → fail 去推送并触发。
            工作区若有未提交改动也 fail 去推送。
            否则 pass 去就绪。不要评论 submit。
      transitions:
        - to: 就绪
          condition: { verdict: pass }
          priority: 1
        - to: 挂起
          condition: { verdict: conditional_pass }
          priority: 2
        - to: 推送并触发
          condition: { verdict: fail }
          priority: 3

    - name: DCO修复
      description: 只补 Signed-off-by，不改业务代码。
      maxSelfTransitions: 3
      position: { x: 380, y: 680 }
      steps:
        - id: fix-dco
          name: 补DCO
          agent: developer
          role: defender
          task: |
            checkout fork 的 head_ref 到 repo/；已有则 fetch，不要每次全量 clone。
            只给缺失的 commit 补 Signed-off-by: Name <email>。不要改业务代码。本状态不要 git commit / git push。
            输出 JSON：verdict、summary、fixed_commits。
        - id: challenge-dco
          name: 质疑DCO
          agent: code-hunter
          role: attacker
          task: 检查是否改了无关代码、是否漏补 Signed-off-by。输出 <step-conclusion>。
        - id: judge-dco
          name: DCO裁决
          agent: code-judge
          role: judge
          task: pass 去推送并触发。conditional_pass 继续补。fail 去人工确认。输出 next_state。
      transitions:
        - to: 推送并触发
          condition: { verdict: pass }
          priority: 1
        - to: DCO修复
          condition: { verdict: conditional_pass }
          priority: 2
        - to: 人工确认
          condition: { verdict: fail }
          priority: 3

    - name: 静态修复
      description: 对着 codeCheck / 静态检查报告改，不要当成编译失败。
      maxSelfTransitions: 3
      position: { x: 740, y: 680 }
      steps:
        - id: fix-static
          name: 修静态检查
          agent: developer
          role: defender
          task: |
            checkout fork head_ref 到 repo/。
            先拉 codeCheck 失败明细：node skills/gitcode-pr-review/scripts/fetch-dcp-report.mjs --report-url <gate-check.json 的 report_url> --out outputs
            读 outputs/dcp-codecheck-defects.json，修 defects 点到的 filepath/line。
            然后同规则扫雷（DCP 一次只报一处，同类问题在 PR 改动里往往多处，逐轮修会浪费多轮 CI）：
            node skills/gitcode-pr-review/scripts/scan-same-rule-defects.mjs --pr-url <PR_URL> --author <author> --defects outputs/dcp-codecheck-defects.json --out outputs
            读 outputs/same-rule-candidates.json，把 candidates 里的 PR 新增行同规则问题一并修掉（needs_escape 的注意转义），与 defects 修复同属一个 commit。
            只改 PR 自己改动的行，不改 PR 未触碰的存量代码，不当编译失败修。
            不要在本机编 Flutter/OH 全量工程。本状态不要 git commit / git push。
            明细拉不到（脚本退出非 0）才 conditional_pass 并写清缺哪份 DCP 日志。
            输出 JSON：verdict、summary、fixed_files、defect_count、same_rule_fixed_count。
        - id: challenge-static
          name: 质疑静态修复
          agent: code-hunter
          role: attacker
          task: 检查是否对着静态检查报告改、是否把 same-rule-candidates.json 的 PR 新增行同类问题一起修了、有没有改到 PR 未触碰的存量代码或改去修编译。输出 <step-conclusion>。
        - id: judge-static
          name: 静态修复裁决
          agent: code-judge
          role: judge
          task: pass 去推送并触发。conditional_pass 继续改。fail 去人工确认。
      transitions:
        - to: 推送并触发
          condition: { verdict: pass }
          priority: 1
        - to: 静态修复
          condition: { verdict: conditional_pass }
          priority: 2
        - to: 人工确认
          condition: { verdict: fail }
          priority: 3

    - name: 编译修复
      description: 对着 DCP 编译失败日志改。
      maxSelfTransitions: 3
      position: { x: 1100, y: 680 }
      steps:
        - id: fix-compile
          name: 修编译
          agent: developer
          role: defender
          task: |
            checkout fork head_ref 到 repo/。对着 DCP 编译失败日志改导致失败的文件。
            不要在步骤里编 Flutter/OH 全量工程。本状态不要 git commit / git push。
            环境抖动豁免重试（env-jitter-retry）：若日志行级实证根因为 CI 环境问题（唯一失败链属基础设施类，如 npm ENOTEMPTY / hvigor wrapper 竞态 / pub get 超时，且 PR 改动文件零编译错误，无代码可修），依次检查：
            a) outputs/env-jitter-used.txt 已存在 → 本 run 豁免已用过，不再自动重试，fail 转人工确认。
            b) 作者凭据：node skills/gitcode-pr-review/scripts/gitcode-token.mjs --check-author <author小写> 退出码非 0 → 无法代发，fail 转人工确认并在结论写明「作者 Token 未注入，需本人在 PR 评论 start build」。
            c) 两者都通过 → fixed_files=[]，verdict=pass，summary 以「env-jitter-retry」开头，next_state=推送并触发；并执行 echo $(date -u +%FT%TZ) >> outputs/env-jitter-used.txt 写入豁免标记（本 run 最多一次）。
            输出 JSON：verdict、summary、fixed_files、remaining_errors。
        - id: challenge-compile
          name: 质疑编译修复
          agent: code-hunter
          role: attacker
          task: 检查是否对着编译日志改、有没有漏修同类报错。env-jitter-retry 豁免时改为质疑：环境根因是否有日志行级实证、PR 文件是否真零编译错误、豁免标记与作者凭据检查是否属实。输出 <step-conclusion>。
        - id: judge-compile
          name: 编译修复裁决
          agent: code-judge
          role: judge
          task: pass 去推送并触发。conditional_pass 继续改。fail 去人工确认。若修编译以 env-jitter-retry 豁免通过（实证 CI 环境问题、无代码可修），pass 的 <step-conclusion> 开头必须原样保留「env-jitter-retry」前缀并写明「豁免重试一次」，供推送并触发识别重发；丢失该标记会导致豁免空转。
      transitions:
        - to: 推送并触发
          condition: { verdict: pass }
          priority: 1
        - to: 编译修复
          condition: { verdict: conditional_pass }
          priority: 2
        - to: 人工确认
          condition: { verdict: fail }
          priority: 3

    - name: 检视修复
      description: 按 PR 上已有 AI 检视意见改；未被检视时尝试同步同主题分支的修复。
      maxSelfTransitions: 3
      position: { x: 1820, y: 680 }
      steps:
        - id: apply-ai-review
          prScript: approved-apply
          name: 按AI检视修改
          agent: developer
          role: defender
          task: |
            先检查 state.yaml 的 globalContext 是否包含 user_fix_feedback: / user_revert: / user_apply_patch:。
            命中任一用户人工指令时，模式C优先：直接执行指令，不要先用目标 PR 的 ai_reviewed 标签或 actionable_count=0 短路；
            也不要重新检视或改动指令范围以外的文件。未命中用户指令时，才运行 fetch-ai-review 并进入模式A/B。
            运行 skills/gitcode-pr-review/scripts/fetch-ai-review.mjs --pr-url <PR_URL> --author <author> --out outputs
            读 outputs/ai-review-comments.json，按以下顺序判断执行模式：

            【模式A：常规检视修复（ai_reviewed=true 或 actionable_count>0）——建议模式，不直接推送】
            actionable_count=0 且 ai_reviewed=true：不要空改，verdict=pass。
            有意见：只处理 comments[]（当前代码的 AI 检视意见和人工行内评论），stale_comments 是旧代码意见不要修。
            在 repo/ 按 path/line 改，只改检视点到的文件。本状态不要 git commit / git push。
            改完代码后生成建议产物（用户在 AIWeb 面板审阅后才决定是否推送）：
            1. git -C repo diff > outputs/fix.patch（无改动则跳过）
            2. 写 outputs/review-suggestion.json：{"mode":"suggestion","head_sha":"<git -C repo rev-parse HEAD>","comment_count":<actionable 条数>,"generated_at":"<ISO8601>"}
            3. verdict=pass、summary 注明「已生成 N 条建议修复（未推送），等待用户决策」。
            用户不采纳是常态：意见是建议不是门禁，不要为了"修完"而扩大改动或重试。
            输出 JSON：verdict、summary、applied_issues。

            【模式B：同主题跨分支修复同步（ai_reviewed=false 且 actionable_count=0）】
            本 PR 未被 AI 检视。checkout fork head_ref 到 repo/ 后：
            1. 运行 skills/gitcode-pr-review/scripts/find-sibling-prs.mjs --pr-url <PR_URL> --author <author> --out outputs
            2. 读 outputs/sibling-prs.json：
               a) 无同主题兄弟 PR（sibling_count=0）→ verdict=pass（无修复可同步）。
               b) 有兄弟但全部未检视（reviewed_siblings 为空）→ verdict=pass（都未检视，无修复来源）。
               c) 有已检视的兄弟（reviewed_siblings 非空）→ 对每个已检视兄弟：
                  - 在 ~/.aceharness/runs/ 目录中查找该 PR 编号的最新 run（目录名含 -pr<编号>-），
                    读取其 outputs/fix.patch
                  - 若找到 fix.patch：git -C repo apply --check <fix.patch 路径>
                  - apply 干净 → git -C repo apply <fix.patch 路径>，verdict=pass，
                    summary 注明「已同步 PR #<兄弟编号> 的修复」、synced_from=#<兄弟编号>
                  - apply 冲突 → 不强推，verdict=conditional_pass，
                    summary 注明「兄弟 PR #<编号> 的修复在本分支有冲突，需人工处理」
            3. 无兄弟 run 有 fix.patch → 对已检视兄弟跑 fetch-ai-review.mjs --pr-url <兄弟PR URL> --author <author>，
               若兄弟有 actionable 意见，将其中的代码修复手动应用到本分支（同模式A逻辑，来源是兄弟的意见）。
            4. 输出 JSON：verdict、summary、applied_issues、synced_from（兄弟 PR 编号或 null）。
            本状态不要 git commit / git push。

            【模式C：用户人工指令（优先级最高；命中时跳过上方模式A/B判断）】
            - user_fix_feedback: 行及后续缩进行为用户修改指令：按指令修改，只改指令涉及的文件；即使目标 PR 已有 AI已检视标签且无本地待处理意见，也必须执行。applied_issues 填「用户反馈：<指令摘要>」。
            - user_apply_patch: run-<id> 行：用户已确认应用建议修复。读取 ~/.aceharness/runs/run-<id>/outputs/fix.patch，
              git -C repo apply --check 通过后 git -C repo apply；apply 冲突说明 PR 基线已漂移，verdict=conditional_pass 并注明需在面板重新生成建议。applied_issues 填「应用建议修复（源 run-<id>）」。此模式改完正常走推送。
            - user_revert: from <sha> to <sha> 行：在 repo/ 执行 git revert --no-commit <sha>..<sha>（无变更则 verdict=pass 并说明无可回退）。applied_issues 填「回退 AI 检视修复」。
        - id: challenge-ai-review
          prScript: approved-apply-audit
          name: 质疑检视修复
          agent: code-hunter
          role: attacker
          task: |
            模式A：检查是否漏掉必须改的检视项，或改了检视没要求的范围。
            模式B（兄弟同步）：检查同步的修复是否真的来自同主题 PR、apply 是否干净无冲突残留、有没有同步了不相关的改动、兄弟 PR 编号与 fix.patch 是否匹配。
            模式C：指令是否执行到位、是否改了指令外的范围。
            输出 <step-conclusion>。
        - id: judge-ai-review
          prScript: approved-apply-audit
          name: 检视修复裁决
          agent: fix-reviewer
          role: judge
          task: |
            pass 去推送并触发（模式B同步成功或无兄弟可同步、模式C指令完成、模式A无意见无需建议）。
            conditional_pass：模式A已生成建议修复（outputs/review-suggestion.json 存在）→ 去挂起等用户在 AIWeb 面板决策（应用/驳回/反馈），不要推送。模式C user_apply_patch 基线冲突也走 conditional_pass 去挂起（需重新生成建议）。
            fail 去人工确认（模式B apply 冲突、指令执行失败）。
      transitions:
        - to: 推送并触发
          condition: { verdict: pass }
          priority: 1
        - to: 挂起
          condition: { verdict: conditional_pass }
          label: 建议修复等用户决策（应用/驳回/反馈）
          priority: 2
        - to: 人工确认
          condition: { verdict: fail }
          priority: 3

    - name: 推送并触发
      description: commit（含 DCO）push 到 fork，再评论恰好一行 start build。禁止 submit。
      maxSelfTransitions: 3
      position: { x: 2180, y: 680 }
      steps:
        - id: push-and-start-build
          name: 推送并start-build
          agent: developer
          role: defender
          task: |
            0. 在任何推送或评论前记录本轮 attempted_at（ISO 时间），写入 outputs/push-result.json；本轮始终保留该时间，门禁查询不能改写它。
            1. git -C repo status。无改动且 gate-check.json 的 phase 不是 need_start_build 且上一步骤（编译修复裁决）结论 summary 不是以 env-jitter-retry 开头：不要空 commit，也不要空评论 start build，verdict=pass
            2. phase=need_start_build 且无改动（CI 抖动重试，gate-check.json 的 start_build_count < start_build_max）：不要 commit、不要 push，直接重发恰好一行 start build，verdict=pass。
               或上一步骤结论 summary 以 env-jitter-retry 开头且工作区无改动（编译失败实证为 CI 环境问题的一次性豁免重试，不受 start_build 预算约束）：同样不 commit、不 push，以作者凭据直接重发恰好一行 start build，verdict=pass，summary 注明 env-jitter-retry 已使用
            3. 有改动（含已暂存改动）：git -C repo diff --binary HEAD > outputs/fix.patch。commit 写清修的是静态/编译/DCO/检视，必须带 Signed-off-by，可用 git commit -s。
               user.email 与 Signed-off-by 必须用 PR 基线 commit（head 起点，即 PR 原始提交）的 author 邮箱——那是作者 GitCode 账号绑定且已签 DCO 的邮箱；禁止从仓库其他历史 commit 或 git config 拿邮箱（1913 事故：拿了旧邮箱导致 DCO 失败）。
               禁止改写历史 commit 的 author 邮箱后 force push——那是顶替他人提交身份，永远不做；DCO 邮箱问题只能由作者本人在线签署对应邮箱的 DCO 协议解决。
               提交身份必须复用 fork 历史提交的作者（git -C repo log -1 --format='%an <%ae>' 取原 PR 提交人），禁止编造邮箱——DCO 校验 Signed-off-by 邮箱必须与 GitCode 账号一致，用错邮箱必挂 DCO
            4. push 到 head_repo 的 head_ref（fork remote），禁止 --force。远程用 https://{author}@gitcode.com/{head_repo}.git，使用该作者自己的凭据。记录 push 完成时间
               作者凭据获取（按序）：① 进程 env 的 GITCODE_TOKEN_<author小写替换非法字符为_>；② env 没有时运行
               node skills/gitcode-pr-review/scripts/gitcode-token.mjs --print-token <author小写>
               （服务端令牌库回退，打印令牌值供 remote URL 使用，exit 1=确实无凭据才转人工确认）。
               「作者 Token 未注入」的结论必须在 ①② 都失败后才能下。
            5. 推送成功后，或 phase=need_start_build：node skills/gitcode-pr-review/scripts/post-pr-comment.mjs --pr-url <PR_URL> --author <author> --body "start build" --out outputs。
               刚 push 过的必须加 --wait-push-ack --since <push完成时间ISO>：GitCode 的 MR 更新事件异步滞后（实测 ~70s），等「监测到PR/代码有更新/感谢提交」确认评论出现再发，否则构建会被中止
            6. 禁止评论 submit，禁止合入
            7. 推送失败时不得声明完成：403/无写权限直接 verdict=fail 去人工确认；网络暂时失败可 conditional_pass。
            8. 写 outputs/push-result.json：push_status=success/failed/not_attempted、attempted_at（本轮动作开始时间）、commit_sha、remote_head_sha、pushed_at（成功推送完成时的 ISO 时间）、error（不得包含令牌）。
               仅当 git ls-remote 对 head_repo/head_ref 返回的 SHA 与本地待推送 commit 一致时，才允许 push_status=success。
               工作区干净不等于推送完成：必须检查 PR 原始 head 到本地 HEAD 是否还有未推送提交，有则继续推送，不得跳过。
            输出 JSON：verdict、summary、push_status、start_build、start_build_count、wait_ack、dco。
        - id: challenge-push
          prScript: push-audit
          name: 质疑推送
          agent: code-hunter
          role: attacker
          task: 检查是否推错成上游仓、是否 force push、是否漏 DCO、是否误评论了 submit。输出 <step-conclusion>。
        - id: judge-push
          prScript: push-audit
          name: 推送裁决
          agent: code-judge
          role: judge
          task: pass 回等待门禁。conditional_pass 重试。fail 去人工确认。禁止把完成写成已合入。
      transitions:
        - to: 等待门禁
          condition: { verdict: pass }
          priority: 1
          label: 已 start build 或无需推送，回去等门禁
        - to: 推送并触发
          condition: { verdict: conditional_pass }
          priority: 2
        - to: 人工确认
          condition: { verdict: fail }
          priority: 3

    - name: 就绪
      description: 门禁标签已绿。通知人去评审、解讨论、自己评论 submit。
      maxSelfTransitions: 1
      position: { x: 2540, y: 80 }
      steps:
        - id: mark-ready
          prScript: ready
          name: 标记就绪
          agent: documentation-writer
          role: defender
          task: |
            工作区还有未推改动 → fail，去推送并触发。
            否则 pass。摘要写清 PR 链接、门禁、改了什么、是否已 start build。
            写明：未 submit、未合入。不要评论 submit。
            输出 JSON：verdict、summary、pr_url、submitted=false、merged=false。
      transitions:
        - to: 完成
          condition: { verdict: pass }
          priority: 1
        - to: 挂起
          condition: { verdict: conditional_pass }
          priority: 2
        - to: 推送并触发
          condition: { verdict: fail }
          priority: 3

    - name: 人工确认
      description: 测试失败、报告打不开、推送无权限等，停下来问人。
      requireHumanApproval: true
      maxSelfTransitions: 1
      position: { x: 1460, y: 980 }
      steps:
        - id: ask-human
          prScript: human
          name: 记录需人工确认
          agent: documentation-writer
          role: defender
          task: |
            写清终止或待确认原因：测试失败 / 未关联 Issue / 报告打不开 / 推送无权限 / 轮次用尽。
            不要自动改测试代码，不要 submit。默认 verdict=pass 进入终止。
            若人要求继续等门禁，用 conditional_pass。
      transitions:
        - to: 终止
          condition: { verdict: pass }
          priority: 1
        - to: 等待门禁
          condition: { verdict: conditional_pass }
          priority: 2
        - to: 终止
          condition: { verdict: fail }
          priority: 3

    - name: 完成
      description: 门禁已绿，等人评审并自己评论 submit。
      isFinal: true
      position: { x: 2900, y: 80 }
      steps:
        - id: complete-pr-self-heal
          prScript: finish
          name: 汇总结果
          agent: documentation-writer
          role: defender
          task: |
            汇总 PR 链接、phase、是否 push、是否 start build。未 submit、未合入不要写成已合入。
            输出 JSON：verdict、summary、pr_url、submitted=false。
      transitions: []

    - name: 终止
      description: 不是自己的 PR，或无法安全自动修。
      isFinal: true
      position: { x: 30, y: 980 }
      steps:
        - id: abort-pr-self-heal
          prScript: finish
          name: 记录终止原因
          agent: documentation-writer
          role: defender
          task: 记录终止原因（他人 PR / 已关闭 / 测试失败 / 缺日志 / 无法推送 / 轮次用尽）和已有产物。
      transitions: []

context:
  projectRoot: "_template"
  workspaceMode: isolated-copy
  requirements: |
    只处理"自己的 PR"（白名单作者或 AIWeb 手动开启者本人）的 GitCode PR。门禁看标签和 openharmony_ci 评论。
    按 DCO / 静态检查 / 编译 / AI 检视分流修复，push 到 fork 后评论 start build。
    测试失败人工确认。禁止自动 submit 和合入。
  timeoutMinutes: 180
  gitBaselineEnabled: false
  skills:
    - gitcode-pr-review
